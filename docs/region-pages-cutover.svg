<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 512" width="840" height="512" role="img" aria-labelledby="t d" data-diagram-type="architecture">
  <title id="t">Region pages: current and proposed data path</title>
  <desc id="d">Today visitors to regions.f3nation.com hit the legacy Cloud Run app in GCP project region-pages, which reads a Neon copy that an ingest job fills from Cloud SQL f3data. After cutover the domain maps to the monorepo app in project f3-region-pages-app, which reads f3data through the F3 API; regions2 301s to regions, and Neon sits idle for a 14-day soak before any signoff-gated teardown.</desc>
  <style>
    svg { --bg: #F5F5F5; --surface: #FFFFFF; --ink: #2D3142; --muted: #4F5D75; --soft: #5A6580; --line: #4F5D75; --rule: #D9DADD; --accent: #B5401C; --accent-tint: #F2E9E6; --link: #2E5AA8; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #2D3142; --surface: #2D3142; --ink: #F5F5F5; --muted: #BFC0C0; --soft: #A3ACC0; --line: #A3ACC0; --rule: #45495A; --accent: #F08A59; --accent-tint: #3D3844; --link: #7FA9E6; }
    }
    .bg { fill: var(--bg); }
    .node rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .node.focal rect { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
    .node.store rect { fill: var(--bg); stroke: var(--muted); stroke-width: 1; }
    .node.optional rect { fill: var(--bg); stroke: var(--soft); stroke-width: 1; stroke-dasharray: 4 3; }
    .label { fill: var(--ink); font-weight: 600; font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; }
    .node.focal .label { fill: var(--accent); }
    .group rect { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 4 4; }
    .group rect.mask, .mask { fill: var(--bg); stroke: none; }
    .edge-label { fill: var(--soft); font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.2; }
    #arrow path { fill: var(--line); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4F5D75"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B5401C"/></marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2E5AA8"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="840" height="512" fill="#F5F5F5"/>
  <g class="group">
    <rect x="24" y="24" width="792" height="216" rx="8"/>
    <rect class="mask" x="36" y="16" width="72" height="16" rx="2"/>
    <text class="edge-label" x="72" y="28" font-size="11" text-anchor="middle" letter-spacing="0.06em">CURRENT</text>
  </g>
  <g class="group">
    <rect x="24" y="272" width="792" height="216" rx="8"/>
    <rect class="mask" x="36" y="264" width="80" height="16" rx="2"/>
    <text class="edge-label" x="76" y="276" font-size="11" text-anchor="middle" letter-spacing="0.06em">PROPOSED</text>
  </g>
  <path class="edge" data-from="v1" data-to="legacy" d="M216 88 H240" marker-end="url(#arrow)"/>
  <path class="edge" data-from="legacy" data-to="neon" d="M408 88 H432" marker-end="url(#arrow)"/>
  <path class="edge" data-from="ingest" data-to="neon" d="M516 152 V120" marker-end="url(#arrow)"/>
  <path class="edge" data-from="ingest" data-to="f3a" d="M600 184 H624" marker-end="url(#arrow)"/>
  <path class="edge" data-from="v2" data-to="app" d="M216 336 H240" marker-end="url(#arrow)"/>
  <path class="edge" data-from="app" data-to="api" d="M408 336 H432" marker-end="url(#arrow)"/>
  <path class="edge" data-from="api" data-to="f3b" d="M600 336 H624" marker-end="url(#arrow)"/>
  <path class="edge" data-from="r2" data-to="v2" d="M132 400 V368" marker-end="url(#arrow)"/>
  <g class="node" data-id="v1">
    <rect x="48" y="56" width="168" height="64" rx="6"/>
    <text class="label" x="132" y="84.5" font-size="14" text-anchor="middle"><tspan x="132">Visitors</tspan><tspan x="132" dy="16.8">regions domain</tspan></text>
  </g>
  <g class="node" data-id="legacy">
    <rect x="240" y="56" width="168" height="64" rx="6"/>
    <text class="label" x="324" y="84.5" font-size="14" text-anchor="middle"><tspan x="324">Legacy app</tspan><tspan x="324" dy="16.8">region-pages GCP</tspan></text>
  </g>
  <g class="node store" data-id="neon">
    <rect x="432" y="56" width="168" height="64" rx="6"/>
    <text class="label" x="516" y="84.5" font-size="14" text-anchor="middle"><tspan x="516">Neon copy</tspan><tspan x="516" dy="16.8">about $26/mo</tspan></text>
  </g>
  <g class="node" data-id="ingest">
    <rect x="432" y="152" width="168" height="64" rx="6"/>
    <text class="label" x="516" y="180.5" font-size="14" text-anchor="middle"><tspan x="516">Ingest job</tspan><tspan x="516" dy="16.8">daily copy</tspan></text>
  </g>
  <g class="node store" data-id="f3a">
    <rect x="624" y="152" width="168" height="64" rx="6"/>
    <text class="label" x="708" y="180.5" font-size="14" text-anchor="middle"><tspan x="708">Cloud SQL</tspan><tspan x="708" dy="16.8">f3data</tspan></text>
  </g>
  <g class="node" data-id="v2">
    <rect x="48" y="304" width="168" height="64" rx="6"/>
    <text class="label" x="132" y="332.5" font-size="14" text-anchor="middle"><tspan x="132">Visitors</tspan><tspan x="132" dy="16.8">regions domain</tspan></text>
  </g>
  <g class="node focal" data-id="app">
    <rect x="240" y="304" width="168" height="64" rx="6"/>
    <text class="label" x="324" y="332.5" font-size="14" text-anchor="middle"><tspan x="324">Monorepo app</tspan><tspan x="324" dy="16.8">new GCP project</tspan></text>
  </g>
  <g class="node" data-id="api">
    <rect x="432" y="304" width="168" height="64" rx="6"/>
    <text class="label" x="516" y="332.5" font-size="14" text-anchor="middle"><tspan x="516">F3 API</tspan><tspan x="516" dy="16.8">apps/api</tspan></text>
  </g>
  <g class="node store" data-id="f3b">
    <rect x="624" y="304" width="168" height="64" rx="6"/>
    <text class="label" x="708" y="332.5" font-size="14" text-anchor="middle"><tspan x="708">Cloud SQL</tspan><tspan x="708" dy="16.8">f3data</tspan></text>
  </g>
  <g class="node" data-id="r2">
    <rect x="48" y="400" width="168" height="64" rx="6"/>
    <text class="label" x="132" y="428.5" font-size="14" text-anchor="middle"><tspan x="132">regions2 alias</tspan><tspan x="132" dy="16.8">301 redirect</tspan></text>
  </g>
  <g class="node optional" data-id="idle">
    <rect x="432" y="400" width="168" height="64" rx="6"/>
    <text class="label" x="516" y="428.5" font-size="14" text-anchor="middle"><tspan x="516">Neon, idle</tspan><tspan x="516" dy="16.8">14-day soak</tspan></text>
  </g>
</svg>
