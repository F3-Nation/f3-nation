<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -28 856 484" width="856" height="484" role="img" aria-labelledby="t d" data-diagram-type="flow">
  <title id="t">Region pages cutover in three stages</title>
  <desc id="d">Today regions.f3nation.com runs on the legacy app, which pays Neon about 26 USD a month to hold a copy of f3data, while the monorepo app already reads f3data through the F3 API at regions2. Cutover maps the domain to the monorepo app, redirects regions2 with a no-store 307, and keeps the legacy app on standby for rollback. During the 14 day soak regions2 stays a 307 and rollback stays ready; only after release signoff does the redirect become a 301 and Neon retire.</desc>
  <style>
    svg { --bg: #F5F5F5; --surface: #FFFFFF; --ink: #2D3142; --muted: #4F5D75; --soft: #5A6580; --line: #4F5D75; --rule: #D9DADD; --accent: #B5401C; --accent-tint: #F2E9E6; --link: #2E5AA8; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #2D3142; --surface: #2D3142; --ink: #F5F5F5; --muted: #BFC0C0; --soft: #A3ACC0; --line: #A3ACC0; --rule: #45495A; --accent: #F08A59; --accent-tint: #3D3844; --link: #7FA9E6; }
    }
    .bg { fill: var(--bg); }
    .node rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .node.focal rect { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
    .node.store rect { fill: var(--bg); stroke: var(--muted); stroke-width: 1; }
    .node.optional rect { fill: var(--bg); stroke: var(--soft); stroke-width: 1; stroke-dasharray: 4 3; }
    .label { fill: var(--ink); font-weight: 600; font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; }
    .node.focal .label { fill: var(--accent); }
    .group rect { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 4 4; }
    .group rect.mask, .mask { fill: var(--bg); stroke: none; }
    .edge-label { fill: var(--soft); font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.2; }
    #arrow path { fill: var(--line); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4F5D75"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B5401C"/></marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2E5AA8"/></marker>
  </defs>
  <rect class="bg" x="-8" y="-28" width="856" height="484"/>
    <g class="group"><rect x="8" y="32" width="256" height="400" rx="8"/></g>
  <text class="label" x="136.0" y="16" font-size="16" text-anchor="middle">1. Today: two apps, one bill</text>
  <g class="node focal" data-id="t-dom"><rect x="24" y="64" width="224" height="64" rx="6"/><text class="label" x="136.0" y="101" font-size="14" text-anchor="middle">regions.f3nation.com</text></g>
  <g class="node" data-id="t-leg"><rect x="24" y="160" width="224" height="64" rx="6"/><text class="label" x="136.0" y="197" font-size="14" text-anchor="middle">Legacy app</text></g>
  <g class="node store" data-id="t-neon"><rect x="24" y="256" width="224" height="64" rx="6"/><text class="label" x="136.0" y="284" font-size="14" text-anchor="middle"><tspan x="136.0">Neon</tspan><tspan x="136.0" dy="16.8">26 USD a month</tspan></text></g>
  <g class="node optional" data-id="t-new"><rect x="24" y="352" width="224" height="64" rx="6"/><text class="label" x="136.0" y="380" font-size="14" text-anchor="middle"><tspan x="136.0">Monorepo app, regions2</tspan><tspan x="136.0" dy="16.8">reads f3data via API</tspan></text></g>
  <path class="edge" data-from="t-dom" data-to="t-leg" d="M136.0 128 V160" marker-end="url(#arrow)"/>
  <path class="edge" data-from="t-leg" data-to="t-neon" d="M136.0 224 V256" marker-end="url(#arrow)"/><text class="edge-label" x="146.0" y="244" font-size="12">copies f3data</text>
  <g class="group"><rect x="296" y="32" width="256" height="400" rx="8"/></g>
  <text class="label" x="424.0" y="16" font-size="16" text-anchor="middle">2. Cutover (this runbook)</text>
  <g class="node" data-id="c-r2"><rect x="312" y="64" width="224" height="64" rx="6"/><text class="label" x="424.0" y="101" font-size="14" text-anchor="middle">regions2.f3nation.com</text></g>
  <g class="node focal" data-id="c-dom"><rect x="312" y="160" width="224" height="64" rx="6"/><text class="label" x="424.0" y="197" font-size="14" text-anchor="middle">regions.f3nation.com</text></g>
  <g class="node" data-id="c-new"><rect x="312" y="256" width="224" height="64" rx="6"/><text class="label" x="424.0" y="293" font-size="14" text-anchor="middle">Monorepo app</text></g>
  <g class="node optional" data-id="c-leg"><rect x="312" y="352" width="224" height="64" rx="6"/><text class="label" x="424.0" y="380" font-size="14" text-anchor="middle"><tspan x="424.0">Legacy app</tspan><tspan x="424.0" dy="16.8">on standby</tspan></text></g>
  <path class="edge" data-from="c-r2" data-to="c-dom" d="M424.0 128 V160" marker-end="url(#arrow)"/><text class="edge-label" x="434.0" y="148" font-size="12">307, no-store</text>
  <path class="edge" data-from="c-dom" data-to="c-new" d="M424.0 224 V256" marker-end="url(#arrow)"/><text class="edge-label" x="434.0" y="244" font-size="12">domain mapping</text>
  <path class="edge" data-from="c-new" data-to="c-leg" d="M424.0 320 V352" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text class="edge-label" x="434.0" y="340" font-size="12">rollback</text>
  <g class="group"><rect x="584" y="32" width="256" height="400" rx="8"/></g>
  <text class="label" x="712.0" y="16" font-size="16" text-anchor="middle">3. Soak, then savings</text>
  <g class="node" data-id="s-soak"><rect x="600" y="64" width="224" height="64" rx="6"/><text class="label" x="712.0" y="92" font-size="14" text-anchor="middle"><tspan x="712.0">14 day soak</tspan><tspan x="712.0" dy="16.8">regions2 stays 307</tspan></text></g>
  <g class="node optional" data-id="s-roll"><rect x="600" y="160" width="224" height="64" rx="6"/><text class="label" x="712.0" y="188" font-size="14" text-anchor="middle"><tspan x="712.0">Rollback ready</tspan><tspan x="712.0" dy="16.8">at every step</tspan></text></g>
  <g class="node" data-id="s-sign"><rect x="600" y="256" width="224" height="64" rx="6"/><text class="label" x="712.0" y="293" font-size="14" text-anchor="middle">Release signoff</text></g>
  <g class="node focal" data-id="s-neon"><rect x="600" y="352" width="224" height="64" rx="6"/><text class="label" x="712.0" y="380" font-size="14" text-anchor="middle"><tspan x="712.0">301 redirect</tspan><tspan x="712.0" dy="16.8">Neon retired</tspan></text></g>
  <path class="edge" data-from="s-soak" data-to="s-roll" d="M712.0 128 V160" marker-end="url(#arrow)"/>
  <path class="edge" data-from="s-roll" data-to="s-sign" d="M712.0 224 V256" marker-end="url(#arrow)"/>
  <path class="edge" data-from="s-sign" data-to="s-neon" d="M712.0 320 V352" marker-end="url(#arrow)"/><text class="edge-label" x="722.0" y="340" font-size="12">one way</text>
</svg>
