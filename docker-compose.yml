# Host ports and container names can be overridden per checkout so several
# worktrees can run side by side: `pnpm local:setup --slot N` writes them to the
# root .env, which Compose reads automatically. Defaults are the values below.
name: f3-local

services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: ${F3_CONTAINER_PREFIX:-f3}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-f3local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f3local}
      POSTGRES_DB: ${POSTGRES_DB:-f3nation}
    ports:
      - "${F3_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-f3local} -d ${POSTGRES_DB:-f3nation}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:6.2.0@sha256:400af848ac3f57938abde4867677df1b195674d232c8896a27d111d04b9c088c
    container_name: ${F3_CONTAINER_PREFIX:-f3}-adminer
    restart: unless-stopped
    ports:
      - "${F3_ADMINER_PORT:-8080}:8080"
    volumes:
      - ./scripts/docker/adminer-plugins.php:/var/www/html/index.php:ro
    depends_on:
      postgres:
        condition: service_healthy

  gcs-emulator:
    image: fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef
    container_name: ${F3_CONTAINER_PREFIX:-f3}-gcs
    restart: unless-stopped
    ports:
      - "${F3_GCS_PORT:-9023}:9023"
    volumes:
      - gcs_data:/data
    command: -scheme http -port 9023 -public-host localhost:${F3_GCS_PORT:-9023} -backend filesystem -filesystem-root /data

  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    container_name: ${F3_CONTAINER_PREFIX:-f3}-mailpit
    restart: unless-stopped
    ports:
      - "${F3_MAILPIT_SMTP_PORT:-1025}:1025" # SMTP — matches EMAIL_SERVER in the .env.example files
      - "${F3_MAILPIT_UI_PORT:-8025}:8025" # Web UI (default http://localhost:8025) — read sent emails here

volumes:
  postgres_data:
  gcs_data:
