name: f3-local

services:
  postgres:
    image: postgres:18.4-trixie@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    container_name: f3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-f3local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f3local}
      POSTGRES_DB: ${POSTGRES_DB:-f3nation}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f3local} -d ${POSTGRES_DB:-f3nation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5.5.0@sha256:494d4a9461105644222c938679fe58d5e3fd13fb228c76a426e81c16d4ffbaef
    container_name: f3-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./scripts/docker/adminer-plugins.php:/var/www/html/index.php:ro
    depends_on:
      postgres:
        condition: service_healthy

  gcs-emulator:
    image: fsouza/fake-gcs-server:1.55.1@sha256:91afded49de804aa61b5f3eb6c7cd65205acf9e5c5e047cf0ba7d9507af806c8
    container_name: f3-gcs
    restart: unless-stopped
    ports:
      - "9023:9023"
    volumes:
      - gcs_data:/data
    command: -scheme http -port 9023 -public-host localhost:9023 -backend filesystem -filesystem-root /data

  mailpit:
    image: axllent/mailpit:v1.30.5@sha256:b868afa176bfd6cce2323ea316cd99ccad77915e51e595748f6d786700ecf109
    container_name: f3-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP — matches EMAIL_SERVER in .env.docker.example
      - "8025:8025" # Web UI — open http://localhost:8025 to read sent emails

volumes:
  postgres_data:
  gcs_data:
