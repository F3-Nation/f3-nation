name: f3-local

services:
  postgres:
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    container_name: f3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-f3local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f3local}
      POSTGRES_DB: ${POSTGRES_DB:-f3nation}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f3local} -d ${POSTGRES_DB:-f3nation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5.5.1@sha256:890cffec7caa20159fb6f68c1a521b2e5879f7314f4845d4ebca7cc1cf145971
    container_name: f3-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./scripts/docker/adminer-plugins.php:/var/www/html/index.php:ro
    depends_on:
      postgres:
        condition: service_healthy

  gcs-emulator:
    image: fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef
    container_name: f3-gcs
    restart: unless-stopped
    ports:
      - "9023:9023"
    volumes:
      - gcs_data:/data
    command: -scheme http -port 9023 -public-host localhost:9023 -backend filesystem -filesystem-root /data

  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    container_name: f3-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP — matches EMAIL_SERVER in .env.docker.example
      - "8025:8025" # Web UI — open http://localhost:8025 to read sent emails

volumes:
  postgres_data:
  gcs_data:
