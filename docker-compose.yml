name: f3-local

services:
  postgres:
    image: postgres:18@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
    container_name: f3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-f3local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f3local}
      POSTGRES_DB: ${POSTGRES_DB:-f3nation}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f3local} -d ${POSTGRES_DB:-f3nation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5.4.2@sha256:983261ecc40a4aaf11e25aeda8ef821f5a43a9f024b3967c81cbcc0e6ce43ba3
    container_name: f3-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./scripts/docker/adminer-plugins.php:/var/www/html/index.php:ro
    depends_on:
      postgres:
        condition: service_healthy

  gcs-emulator:
    image: fsouza/fake-gcs-server:1.54.0@sha256:3730da0e31f7e5186a90ec4899dc2c336104e7599df400411392ef17e684c31f
    container_name: f3-gcs
    restart: unless-stopped
    ports:
      - "9023:9023"
    volumes:
      - gcs_data:/data
    command: -scheme http -port 9023 -public-host localhost:9023 -backend filesystem -filesystem-root /data

  mailpit:
    image: axllent/mailpit:v1.30.4@sha256:5a49a77c5bdbe7c5474450b4f46348d09949df3695257729c93a30369382d4f6
    container_name: f3-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP — matches EMAIL_SERVER in .env.docker.example
      - "8025:8025" # Web UI — open http://localhost:8025 to read sent emails

volumes:
  postgres_data:
  gcs_data:
