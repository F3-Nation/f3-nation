# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# `inheritance: true` merges this file over the organization and repository UI
# settings instead of replacing them.
#
# CodeRabbit reads every AGENTS.md by default, scoped to its directory. It
# doesn't read REVIEW.md by default; this pattern adds it, with the same
# directory scoping.
inheritance: true
knowledge_base:
  code_guidelines:
    filePatterns:
      - "**/REVIEW.md"
