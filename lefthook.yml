pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: "**/*.{ts,tsx,js,jsx,mjs,cjs,json,css,md,yml,yaml}"
      run: pnpm exec prettier --write --cache --cache-location node_modules/.cache/.prettiercache {staged_files}
      stage_fixed: true

    - name: eslint
      run: pnpm lint:fix

    - name: typecheck
      run: pnpm typecheck
