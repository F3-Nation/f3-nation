runConfig:
  maxInstances: 4
  minInstances: 0
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  # Shared values (same in all environments)
  - variable: AUTH_PROVIDER_URL
    value: https://auth.f3nation.com
  - variable: GCS_BUCKET
    value: f3-logos

  # Per-environment config (not sensitive, but differs per project)
  - variable: NEXT_PUBLIC_SITE_URL
    secret: next-public-site-url
  - variable: ENVIRONMENT
    secret: environment
  - variable: OAUTH_CLIENT_ID
    secret: oauth-client-id
  - variable: OAUTH_REDIRECT_URI
    secret: oauth-redirect-uri
  - variable: F3_API_BASE_URL
    secret: f3-api-base-url

  # Secrets (sensitive)
  - variable: OAUTH_CLIENT_SECRET
    secret: oauth-client-secret
  - variable: SESSION_SECRET
    secret: session-secret
  - variable: F3_API_KEY
    secret: f3-api-key
  - variable: GCS_CREDENTIALS
    secret: gcs-credentials
