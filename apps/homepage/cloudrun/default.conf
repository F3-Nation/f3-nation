# Serves the homepage static export (apps/homepage/out) on Cloud Run.
# Replaces the image's /etc/nginx/conf.d/default.conf. Staging only: prod is
# served by GitHub Pages (see ../README.md#staging).

server {
    # Cloud Run sends traffic to $PORT, which defaults to 8080 — the port the
    # unprivileged nginx image can bind without root.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Cloud Run terminates TLS in front of the container, so any redirect nginx
    # issues itself must stay relative instead of pointing at http://host:8080.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # `add_header` in a location replaces the server-level set, so each
    # location repeats the noindex header.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # trailingSlash: true exports each route as <route>/index.html, so a bare
    # /org is served by the $uri/ directory match.
    # Pages revalidate on every load so a new deploy shows up right away.
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Content-hashed build assets never change for a given URL.
    location /_next/static/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
