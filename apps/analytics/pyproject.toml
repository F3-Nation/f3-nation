[project]
name = "f3-nation-analytics"
version = "1.2.0"
description = "Foundation for the F3 Nation analytics Parquet ETL"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb==1.5.6",
    "google-cloud-storage>=3.17.0,<3.18.0",
    "psycopg[binary]>=3.2,<4.0",
    "pytz>=2024.1,<2027.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10.0.0", "ruff==0.16.3", "mypy>=2.4.0,<2.5.0"]

[project.scripts]
analytics-etl = "analytics.cli:main"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
# Keep Analytics' existing import ordering.
relative-imports-order = "furthest-to-closest"
extra-standard-library = []

[tool.mypy]
python_version = "3.13"
files = ["analytics"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["analytics*"]

[tool.setuptools.package-data]
analytics = ["sql/*.sql"]
