[project]
name = "f3-nation-analytics"
version = "0.1.0"
description = "Foundation for the F3 Nation analytics Parquet ETL"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "duckdb==1.4.3",
    "google-cloud-bigquery>=3.25.0,<4.0.0",
    "google-cloud-storage>=2.18.0,<3.0.0",
    "pytz>=2024.1,<2027.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "ruff>=0.14.0,<1.0.0",
]

[project.scripts]
analytics-etl = "analytics.cli:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["analytics*"]

[tool.setuptools.package-data]
analytics = ["sql/*.sql"]
