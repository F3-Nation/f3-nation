steps:
  # Debug step
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "Debug: DOPPLER_TOKEN available: ${_DOPPLER_TOKEN:0:5}..."
    secretEnv: ["_DOPPLER_TOKEN"]

  # Build step with correct secret handling
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker build \
          --build-arg "DOPPLER_TOKEN=$$_DOPPLER_TOKEN" \
          --build-arg "ENVIRONMENT=$$_ENVIRONMENT" \
          -t us-east1-docker.pkg.dev/f3-admin-portal-staging/cloud-run-builds/f3-admin:staging \
          -f apps/admin/Dockerfile \
          .
    secretEnv: ["_DOPPLER_TOKEN"]

  # Push step
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-east1-docker.pkg.dev/f3-admin-portal-staging/cloud-run-builds/f3-admin:staging",
      ]

  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "f3-admin"
      - "--image"
      - "us-east1-docker.pkg.dev/f3-admin-portal-staging/cloud-run-builds/f3-admin:staging"
      - "--region"
      - "us-east1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/104614337679/secrets/DOPPLER_TOKEN_ADMIN_STAGING/versions/latest
      env: "_DOPPLER_TOKEN"
