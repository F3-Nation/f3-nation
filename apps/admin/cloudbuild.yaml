steps:
  # Debug step
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "Debug: DOPPLER_TOKEN available: ${_DOPPLER_TOKEN:0:5}..."
    secretEnv: ["_DOPPLER_TOKEN"]

  # Build step with correct secret handling
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker build \
          --build-arg "DOPPLER_TOKEN=$$_DOPPLER_TOKEN" \
          --build-arg "ENVIRONMENT=$$_ENVIRONMENT" \
          -t gcr.io/pin-mastery/f3-nation-admin \
          -f apps/admin/Dockerfile \
          .
    secretEnv: ["_DOPPLER_TOKEN"]

  # Push step
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/pin-mastery/f3-nation-admin"]

  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "f3-nation-admin"
      - "--image"
      - "gcr.io/pin-mastery/f3-nation-admin"
      - "--region"
      - "us-east1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/614333864021/secrets/DOPPLER_TOKEN_ADMIN/versions/latest
      env: "_DOPPLER_TOKEN"
