[tool.ruff]
line-length = 120

select = [
    "E", # pycodestyle errors (settings from FastAPI, thanks, @tiangolo!)
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
]
ignore = [
    "C901", # too complex
]

[tool.ruff.isort]
order-by-type = true
relative-imports-order = "closest-to-furthest"
extra-standard-library = ["typing"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
known-first-party = []

[project]
name = "f3-nation-slack-bot"
version = "1.13.0"
description = ""
authors = [{ name = "Evan Petzoldt", email = "evan.petzoldt@protonmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "slack-bolt>=1.18.1,<2.0.0",
    "datetime>=5.5,<6.0.0",
    "cryptography>=46.0.5",
    "sqlalchemy>=2.0.28,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "requests-oauthlib>=1.3.1,<2.0.0",
    "sqlalchemy-utils>=0.41.1,<0.42.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "functions-framework>=3.8.1,<4.0.0",
    "pg8000>=1.31.5,<2.0.0",
    "cloud-sql-python-connector>=1.20.0,<2.0.0",
    "google-cloud-logging>=3.11.0,<4.0.0",
    "f3-data-models",
    "pre-commit>=4.2.0,<5.0.0",
    "pillow>=12.2.0",
    "pillow-heif>=0.15.0,<0.16.0",
    "watchfiles>=1.1.1,<2.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "sendgrid>=6.11.0,<7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9.0.0",
    "sqlalchemy-schemadisplay>=2.0,<3.0",
    "graphviz>=0.20.3,<0.21.0",
    "ipykernel>=6.30.1,<7.0.0",
    "kaleido>=1.1.0,<2.0.0",
    "mplcyberpunk>=0.7.6,<0.8.0",
    "matplotlib>=3.10.7,<4.0.0",
    "playwright>=1.44.0,<2.0.0",
    "dataframe-image>=0.2.7,<0.3.0",
    "pandas>=2.2.2,<3.0.0",
    "debugpy>=1.8.17,<2.0.0",
    "commitizen>=4.13.9,<5.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["application*", "features*", "infrastructure*", "utilities*"]
exclude = ["tests*", "assets*", "scripts*"]
