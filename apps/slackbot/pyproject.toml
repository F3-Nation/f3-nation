[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
source = ["application", "infrastructure", "utilities", "features"]
data_file = "coverage/.coverage"

[tool.coverage.report]
fail_under = 62.19
precision = 2

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.13"
# Scoped to the two layers that are well-tested and already near type-clean;
# `features/` and `utilities/` are explicitly out of scope.
files = ["application", "infrastructure"]
warn_unused_ignores = true
warn_redundant_casts = true

[project]
name = "f3-nation-slack-bot"
version = "2.10.0"
description = ""
authors = [{ name = "Evan Petzoldt", email = "evan.petzoldt@protonmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "slack-bolt==1.30.0",
    "cryptography==50.0.0",
    "sqlalchemy==2.0.52",
    "requests==2.34.2",
    "requests-oauthlib==2.0.0",
    "sqlalchemy-utils==0.43.0",
    "psycopg2-binary==2.9.13",
    "functions-framework==3.10.2",
    "pg8000==1.31.5",
    "cloud-sql-python-connector==1.21.0",
    "google-cloud-logging==3.16.2",
    "f3-data-models",
    "pillow==13.0.0",
    "pillow-heif==1.8.0",
    "watchfiles==1.2.0",
    "python-dotenv==1.2.2",
    "pytz==2026.3.post1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "pandas==2.3.3",
    "debugpy==1.8.21",
    "ruff==0.17.3",
    "mypy==2.4.0",
    "pytest-cov==7.1.0",
]
scripts = [
    "mplcyberpunk==0.7.6",
    "matplotlib==3.11.1",
    "playwright==1.62.0",
    "dataframe-image==0.2.7",
    "pandas==2.3.3",
]

[build-system]
requires = ["setuptools==84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
utilities = ["default_help.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["application*", "features*", "infrastructure*", "utilities*"]
exclude = ["tests*", "assets*", "scripts*"]
