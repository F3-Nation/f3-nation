[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors (settings from FastAPI, thanks, @tiangolo!)
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
]
ignore = [
    "C901", # too complex
]

[tool.ruff.lint.isort]
order-by-type = true
relative-imports-order = "closest-to-furthest"
extra-standard-library = ["typing"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
known-first-party = []

[tool.mypy]
python_version = "3.13"
# Scoped to the two layers that are well-tested and already near type-clean;
# `features/` and `utilities/` are explicitly out of scope.
files = ["application", "infrastructure"]
warn_unused_ignores = true
warn_redundant_casts = true

[project]
name = "f3-nation-slack-bot"
version = "2.3.2"
description = ""
authors = [{ name = "Evan Petzoldt", email = "evan.petzoldt@protonmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "slack-bolt>=1.18.1,<2.0.0",
    "cryptography>=46.0.5",
    "sqlalchemy>=2.0.28,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "requests-oauthlib>=1.3.1,<2.0.0",
    "sqlalchemy-utils>=0.41.1,<0.42.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "functions-framework>=3.8.1,<4.0.0",
    "pg8000>=1.31.5,<2.0.0",
    "cloud-sql-python-connector>=1.20.0,<2.0.0",
    "google-cloud-logging>=3.11.0,<4.0.0",
    "f3-data-models",
    "pillow>=12.2.0",
    "pillow-heif>=1.3.0,<1.4.0",
    "watchfiles>=1.1.1,<2.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "sendgrid>=6.11.0,<7.0.0",
    "pytz>=2026.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<9.1.0",
    "debugpy>=1.8.17,<2.0.0",
    "ruff>=0.14.0,<1.0.0",
    "mypy>=1.14.0,<2.0.0",
]
scripts = [
    "mplcyberpunk>=0.7.6,<0.8.0",
    "matplotlib>=3.10.7,<4.0.0",
    "playwright>=1.44.0,<2.0.0",
    "dataframe-image>=0.2.7,<0.3.0",
    "pandas>=2.2.2,<3.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
utilities = ["default_help.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["application*", "features*", "infrastructure*", "utilities*"]
exclude = ["tests*", "assets*", "scripts*"]
