[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors (settings from FastAPI, thanks, @tiangolo!)
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
]
ignore = [
    "C901", # too complex
]

[tool.ruff.lint.isort]
order-by-type = true
relative-imports-order = "closest-to-furthest"
extra-standard-library = ["typing"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
known-first-party = []

[tool.mypy]
python_version = "3.12"
# Scoped to the two layers that are well-tested and already near type-clean;
# `features/` and `utilities/` are explicitly out of scope.
files = ["application", "infrastructure"]
warn_unused_ignores = true
warn_redundant_casts = true

[project]
name = "f3-nation-slack-bot"
version = "2.2.1"
description = ""
authors = [{ name = "Evan Petzoldt", email = "evan.petzoldt@protonmail.com" }]
readme = "README.md"
requires-python = ">=3.14.7,<4.0"
dependencies = [
    "slack-bolt>=1.30.0,<2.0.0",
    "cryptography>=46.0.5",
    "sqlalchemy>=2.0.51,<3.0.0",
    "requests>=2.34.2,<3.0.0",
    "requests-oauthlib>=1.3.1,<2.0.0",
    "sqlalchemy-utils>=0.42.1,<0.42.2",
    "psycopg2-binary>=2.9.12,<3.0.0",
    "functions-framework>=3.10.2,<4.0.0",
    "pg8000>=1.31.5,<2.0.0",
    "cloud-sql-python-connector>=1.21.0,<2.0.0",
    "google-cloud-logging>=3.16.2,<4.0.0",
    "f3-data-models",
    "pillow>=12.3.0",
    "pillow-heif>=1.5.0,<1.5.1",
    "watchfiles>=1.2.0,<2.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "sendgrid>=6.12.5,<7.0.0",
    "pytz>=2026.3.post1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<9.1.2",
    "debugpy>=1.8.21,<2.0.0",
    "ruff>=0.16.1,<1.0.0",
    "mypy>=1.20.2,<2.0.0",
]
scripts = [
    "mplcyberpunk>=0.7.6,<0.8.0",
    "matplotlib>=3.11.1,<4.0.0",
    "playwright>=1.62.0,<2.0.0",
    "dataframe-image>=0.2.7,<0.3.0",
    "pandas>=2.3.3,<3.0.0",
]

[build-system]
requires = ["setuptools>=68.2.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
utilities = ["default_help.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["application*", "features*", "infrastructure*", "utilities*"]
exclude = ["tests*", "assets*", "scripts*"]
