name: Setup Node, pnpm, Python, and uv
description: >-
  Install Python and uv, then pnpm and Node (pinned via .nvmrc), restore the
  pnpm store cache, and install workspace dependencies from the frozen
  lockfile. Shared by Node-based workflow jobs so the toolchain setup cannot
  drift between callers.

inputs:
  select-turbo-affected:
    description: >-
      On pull requests, select affected Turbo workspaces. Falls back to the
      full workspace when Turbo finds no affected package.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13.15"

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.4"

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Select Turbo scope
      if: inputs.select-turbo-affected == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
      run: bash scripts/select-turbo-scope.sh
