name: Setup Node, pnpm, Python, and uv
description: >-
  Install Python and uv, then pnpm and Node (pinned via .nvmrc), restore the
  pnpm store cache, and install workspace dependencies from the frozen
  lockfile. Shared by Node-based workflow jobs so the toolchain setup cannot
  drift between callers.

inputs:
  select-turbo-affected:
    description: >-
      On pull requests, restrict Turbo to affected workspaces. Falls back to
      the full workspace when the comparison SHAs are unavailable, detection
      fails, or Turbo selects no runnable task. Files Turbo cannot attribute
      to a package are listed in turbo.json's globalDependencies, which marks
      every workspace affected.
    required: false
    default: "false"
  turbo-task:
    description: >-
      Turbo task the calling job will run. Used to confirm affected selection
      schedules at least one task before enabling --affected. When affected
      selection is enabled, setup exports TURBO_RUN_ARGS and the pinned
      TURBO_SCM_BASE/TURBO_SCM_HEAD through GITHUB_ENV; the caller must
      append ${TURBO_RUN_ARGS:+"$TURBO_RUN_ARGS"} to its Turbo command. An
      empty task falls back to the full workspace.
    required: false
    default: ""
  enable-turbo-cache:
    description: Configure the GitHub Actions-backed Turborepo remote cache.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13.15"

    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.5"

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # A required check must never report success having run nothing, so
    # --affected is enabled only once Turbo confirms it schedules a task.
    # Anything else falls back to the full workspace.
    - name: Select Turbo scope
      if: inputs.select-turbo-affected == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        TURBO_SCOPE_TASK: ${{ inputs.turbo-task }}
      run: bash scripts/select-turbo-scope.sh

    - name: Configure Turbo cache
      if: inputs.enable-turbo-cache == 'true'
      uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      with:
        provider: github
        cache-prefix: turbo-
        use-relative-cache-path: "true"
        server-port: "0"
