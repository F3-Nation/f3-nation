name: Reusable Cloud Run Job Deploy

# Reusable pipeline for Cloud Run Jobs (batch/cron workloads).
# ci-gate -> build image once -> deploy staging job -> promote + deploy prod job.

on:
  workflow_call:
    inputs:
      image_name:
        description: "Artifact Registry image name (e.g. f3-bot-scripts)"
        required: true
        type: string
      job_name:
        description: "Cloud Run Job name"
        required: true
        type: string
      staging_job_name:
        description: "Optional staging Cloud Run Job name"
        required: false
        type: string
        default: ""
      prod_job_name:
        description: "Optional production Cloud Run Job name"
        required: false
        type: string
        default: ""
      staging_runtime_service_account:
        description: "Optional staging runtime service account"
        required: false
        type: string
        default: ""
      prod_runtime_service_account:
        description: "Optional production runtime service account"
        required: false
        type: string
        default: ""
      staging_project:
        description: "GCP project ID for staging"
        required: true
        type: string
      prod_project:
        description: "GCP project ID for production"
        required: true
        type: string
      tag_prefix:
        description: "Tag prefix to strip for the image version (e.g. slackbot@)"
        required: true
        type: string
      ref:
        description: "Release tag to deploy. Empty means the ref that triggered the run (tag push)."
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile"
        required: true
        type: string
      build_context:
        description: "Docker build context path"
        required: false
        type: string
        default: "."
      staging_environment:
        description: "GitHub Environment name for staging"
        required: true
        type: string
      prod_environment:
        description: "GitHub Environment name for production"
        required: true
        type: string
      region:
        description: "GCP region"
        required: false
        type: string
        default: us-east1
      ar_repo:
        description: "Artifact Registry repository"
        required: false
        type: string
        default: cloud-run-builds
      flags:
        description: "Extra flags passed directly to gcloud run jobs deploy"
        required: false
        type: string
        default: ""
      staging_flags:
        description: "Staging-only flags passed directly to gcloud run jobs deploy; falls back to flags when empty"
        required: false
        type: string
        default: ""
      prod_flags:
        description: "Production-only flags passed directly to gcloud run jobs deploy; falls back to flags when empty"
        required: false
        type: string
        default: ""
      smoke_test_app:
        description: >-
          Section key matching a "## <key>" heading in .github/smoke-tests/checklists.md
          to sync into the staging smoke-test tracker issue after a successful staging
          deploy; empty skips
        required: false
        type: string
        default: ""
      app_label:
        description: "Existing 'app: X' label to apply to the staging smoke-test tracker issue"
        required: false
        type: string
        default: ""

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Validate deploy ref is an existing release tag
        if: inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${REF}" != "${TAG_PREFIX}"* ]]; then
            echo "::error::ref '${REF}' does not start with expected tag prefix '${TAG_PREFIX}'"
            exit 1
          fi
          if ! gh api "repos/${{ github.repository }}/git/refs/tags/${REF}" >/dev/null 2>&1; then
            echo "::error::ref '${REF}' is not an existing release tag"
            exit 1
          fi

      # lint-title is deliberately excluded: it only runs on `pull_request`
      # (pr-title.yml has no `push` trigger), so it never has a check-run
      # against a commit reached via tag push -- waiting on it here would
      # hang until timeout, not deploy.
      #
      # NOTE: wait-on-check-action only fails when the filtered check list is
      # completely empty (fail-on-no-checks). Redeploying a tag older than the
      # newest required check (e.g. db-schema-sync, added 2026-08-18) passes
      # ci-gate using only the checks that existed at that tag's commit --
      # newer required checks are silently skipped, not failed.
      - name: Wait for CI to pass
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-regexp: "^(build|lint|typecheck|format-check|test-coverage|test-coverage-hono|security-audit|db-schema-sync)$"
          wait-interval: 15
          allowed-conclusions: success

  build:
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.staging_environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Authenticate to GCP (staging project for AR)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Authorize Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev --quiet

      - name: Extract tag version
        id: meta
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          DEPLOY_REF: ${{ inputs.ref }}
          REGION: ${{ inputs.region }}
          STAGING_PROJECT: ${{ inputs.staging_project }}
          AR_REPO: ${{ inputs.ar_repo }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          TAG="${DEPLOY_REF:-$GITHUB_REF_NAME}"
          VERSION="${TAG#"${TAG_PREFIX}"}"
          IMAGE="${REGION}-docker.pkg.dev/${STAGING_PROJECT}/${AR_REPO}/${IMAGE_NAME}:${VERSION}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          TURBO_VERSION=$(grep '^  turbo:' pnpm-workspace.yaml | awk '{print $2}')
          # Cloud Run only runs linux/amd64. The Dockerfile FROM lines no longer
          # pin --platform (BuildKit lint), so the target arch is set here.
          docker build \
            --platform=linux/amd64 \
            --file "${DOCKERFILE}" \
            --build-arg TURBO_VERSION="${TURBO_VERSION}" \
            --tag "${IMAGE}" \
            "${BUILD_CONTEXT}"
          docker push "${IMAGE}"

      - name: Resolve immutable image digest
        id: digest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          PROJECT_ID: ${{ inputs.staging_project }}
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          IMAGE_PATH="${IMAGE%:*}"
          DIGESTS="$(gcloud artifacts docker images list "${IMAGE_PATH}" --project "${PROJECT_ID}" --include-tags --filter="tags=${TAG}" --format='value(digest)')"

          if [[ -z "${DIGESTS}" ]]; then
            echo "No image found for exact tag ${TAG}" >&2
            exit 1
          fi

          mapfile -t DIGESTS <<< "${DIGESTS}"
          if [[ "${#DIGESTS[@]}" -ne 1 ]] || [[ ! "${DIGESTS[0]}" =~ ^sha256: ]]; then
            echo "Expected one valid digest for tag ${TAG}, got ${#DIGESTS[@]}" >&2
            exit 1
          fi

          echo "digest=${DIGESTS[0]}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.staging_environment }}
    steps:
      - name: Authenticate to GCP (staging)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy Cloud Run Job (staging)
        env:
          JOB_NAME: ${{ inputs.staging_job_name || inputs.job_name }}
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          REGION: ${{ inputs.region }}
          PROJECT_ID: ${{ inputs.staging_project }}
          FLAGS: ${{ inputs.staging_flags || inputs.flags }}
          RUNTIME_SERVICE_ACCOUNT: ${{ inputs.staging_runtime_service_account }}
        run: |
          if [[ -n "${FLAGS}" ]]; then
            # shellcheck disable=SC2206
            extra_flags=(${FLAGS})
          else
            extra_flags=()
          fi

          if [[ -n "${RUNTIME_SERVICE_ACCOUNT}" ]]; then
            extra_flags+=("--service-account=${RUNTIME_SERVICE_ACCOUNT}")
          fi

          gcloud run jobs deploy "${JOB_NAME}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            "${extra_flags[@]}"

  # ── Update the shared staging smoke-test tracker issue after a successful staging deploy ──
  smoke-test-issue:
    needs: [build, deploy-staging]
    if: inputs.smoke_test_app != ''
    runs-on: ubuntu-latest
    # No concurrency group here: with cancel-in-progress: false, Actions only
    # keeps ONE job pending per group and cancels any earlier pending job when
    # a new one arrives — a burst of 3+ near-simultaneous staging deploys
    # (e.g. a release-please merge tagging several apps at once) would silently
    # drop the evicted job's tracker update. The composite action below
    # verifies its own write and retries on conflict instead, so every job
    # runs and self-corrects rather than being queued and possibly skipped.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/staging-smoke-test-issue
        with:
          service_name: ${{ inputs.job_name }}
          version: ${{ needs.build.outputs.version }}
          app_key: ${{ inputs.smoke_test_app }}
          app_label: ${{ inputs.app_label }}
          github_token: ${{ github.token }}

  deploy-prod:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.prod_environment }}
    steps:
      - name: Authenticate to GCP (staging — pull image from staging AR)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Promote image to production Artifact Registry
        env:
          REGION: ${{ inputs.region }}
          PROD_PROJECT: ${{ inputs.prod_project }}
          AR_REPO: ${{ inputs.ar_repo }}
          IMAGE_NAME: ${{ inputs.image_name }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          STAGING_IMAGE="${IMAGE}@${DIGEST}"
          PROD_IMAGE="${REGION}-docker.pkg.dev/${PROD_PROJECT}/${AR_REPO}/${IMAGE_NAME}:${VERSION}"
          if [[ "${PROD_PROJECT}" == "${{ inputs.staging_project }}" ]]; then
            echo "prod_image=${STAGING_IMAGE}" >> "$GITHUB_ENV"
          else
            gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
            docker pull "${STAGING_IMAGE}"
            docker tag "${STAGING_IMAGE}" "${PROD_IMAGE}"
            docker push "${PROD_IMAGE}"
            PROD_DIGEST="$(gcloud artifacts docker images describe "${PROD_IMAGE}" --project "${PROD_PROJECT}" --format='value(image_summary.digest)')"
            test -n "${PROD_DIGEST}"
            echo "prod_image=${PROD_IMAGE}@${PROD_DIGEST}" >> "$GITHUB_ENV"
          fi

      - name: Deploy Cloud Run Job (prod)
        env:
          JOB_NAME: ${{ inputs.prod_job_name || inputs.job_name }}
          IMAGE: ${{ env.prod_image }}
          REGION: ${{ inputs.region }}
          PROJECT_ID: ${{ inputs.prod_project }}
          FLAGS: ${{ inputs.prod_flags || inputs.flags }}
          RUNTIME_SERVICE_ACCOUNT: ${{ inputs.prod_runtime_service_account }}
        run: |
          if [[ -n "${FLAGS}" ]]; then
            # shellcheck disable=SC2206
            extra_flags=(${FLAGS})
          else
            extra_flags=()
          fi

          if [[ -n "${RUNTIME_SERVICE_ACCOUNT}" ]]; then
            extra_flags+=("--service-account=${RUNTIME_SERVICE_ACCOUNT}")
          fi

          gcloud run jobs deploy "${JOB_NAME}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            "${extra_flags[@]}"
