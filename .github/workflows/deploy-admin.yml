name: Deploy Admin

on:
  push:
    tags:
      - "admin@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)deploy, e.g. admin@1.2.3"
        required: true
        type: string

# Prevent concurrent deploys of the same tag
concurrency:
  group: deploy-admin-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Reusable workflows can't elevate GITHUB_TOKEN beyond what the caller grants.
# id-token: write -> GCP OIDC (google-github-actions/auth); checks: read -> CI gate.
permissions:
  contents: read
  id-token: write
  checks: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      ref: ${{ inputs.tag }}
      image_name: f3-admin
      service_name: f3-admin
      staging_project: f3-admin-portal-staging
      prod_project: f3-admin-portal
      tag_prefix: admin@
      dockerfile: apps/admin/Dockerfile
      staging_environment: admin-staging
      prod_environment: admin-production
      staging_url: https://staging.admin.f3nation.com
      prod_url: https://admin.f3nation.com
      # Each environment runs as its own runtime service account, which holds
      # the service's bucket and secret grants. See "Create Runtime Service
      # Accounts and Cloud Run Services" in docs/GCP_APP_SETUP.md.
      staging_flags: "--max-instances=25 --service-account=cloudrun-f3-admin@f3-admin-portal-staging.iam.gserviceaccount.com"
      prod_flags: "--max-instances=25 --service-account=cloudrun-f3-admin@f3-admin-portal.iam.gserviceaccount.com"
    secrets:
      posthog_key: ${{ secrets.POSTHOG_KEY }}
