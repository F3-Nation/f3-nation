name: Deploy Admin

on:
  push:
    tags:
      - "admin@*"

# Prevent concurrent deploys of the same tag
concurrency:
  group: deploy-admin-${{ github.ref_name }}
  cancel-in-progress: false

# Reusable workflows can't elevate GITHUB_TOKEN beyond what the caller grants.
# id-token: write -> GCP OIDC (google-github-actions/auth); checks: read -> CI gate;
# issues: write -> file the post-staging-deploy smoke-test issue.
permissions:
  contents: read
  id-token: write
  checks: read
  issues: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      image_name: f3-admin
      service_name: f3-admin
      staging_project: f3-admin-portal-staging
      prod_project: f3-admin-portal
      tag_prefix: admin@
      dockerfile: apps/admin/Dockerfile
      staging_environment: admin-staging
      prod_environment: admin-production
      staging_url: https://staging.admin.f3nation.com
      prod_url: https://admin.f3nation.com
      smoke_test_file: .github/smoke-tests/admin.md
      app_label: "app: admin"
