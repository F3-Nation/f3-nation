name: Deploy API

on:
  push:
    tags:
      - "api@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)deploy, e.g. api@1.2.3"
        required: true
        type: string

# Prevent concurrent deploys of the same tag
concurrency:
  group: deploy-api-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Reusable workflows can't elevate GITHUB_TOKEN beyond what the caller grants.
# id-token: write -> GCP OIDC (google-github-actions/auth); checks: read -> CI gate;
# issues: write -> file the post-staging-deploy smoke-test issue.
permissions:
  contents: read
  id-token: write
  checks: read
  issues: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      ref: ${{ inputs.tag }}
      image_name: f3-api
      service_name: f3-api
      staging_project: f3-api-app-staging
      prod_project: f3-api-app
      tag_prefix: api@
      dockerfile: apps/api/Dockerfile
      staging_environment: api-staging
      prod_environment: api-production
      staging_url: https://staging.api.f3nation.com
      prod_url: https://api.f3nation.com
      smoke_test_app: api
      app_label: "app: api"
      # Bound instances x per-instance db pool below the pooler's client
      # ceiling — sizing rationale in docs/AI_DEVELOPMENT_GUIDE.md ("Data layer").
      flags: "--max-instances=25"
