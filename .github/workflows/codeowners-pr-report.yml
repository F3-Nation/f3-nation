name: Codeowners PR report

# Posts the Codeowners PR Report to the Codeowners Slack channel each weekday
# morning: the open PRs a codeowner can act on today, grouped by the next step,
# each with a light for how long it has waited. Stages come from
# scripts/pr-triage.sh; whose turn a PR is, and the light's thresholds, come
# from .github/scripts/pr-author-nudge.cjs, so a PR waiting on its author is
# never listed. .github/scripts/codeowners-pr-report.cjs builds the message.
#
# Posts through the incoming webhook in the SLACK_CODEOWNERS_WEBHOOK_URL
# secret, the same one pr-author-nudge.yml uses. The repository variable
# CODEOWNERS_SLACK_IDS (JSON of GitHub login to Slack member ID) turns
# assignees and thread openers into Slack mentions; unmapped logins show as
# plain text. A manual run is a dry run by default: the message goes to the
# job summary only. Every run writes it there.

on:
  schedule:
    # Weekdays at 8:07 Central Standard Time (9:07 during daylight time),
    # hours after pr-author-nudge.yml's daily run.
    - cron: "7 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Write the report to the job summary without posting it"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  report:
    if: github.repository_owner == 'F3-Nation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the scripts and read branch rules
      pull-requests: read # read PRs, reviews, threads and assignees
      checks: read # read check runs (bot status, required checks)
      statuses: read # read legacy commit statuses (CodeRabbit)
    steps:
      - name: Check out the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sort open PRs by stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/pr-triage.sh -R "$GITHUB_REPOSITORY" --json >"$RUNNER_TEMP/board.json"

      - name: Build the report
        id: report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # A manual run uses its input; a scheduled run posts.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || 'false' }}
          SLACK_IDS: ${{ vars.CODEOWNERS_SLACK_IDS }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { collectFacts } = require('./.github/scripts/pr-author-nudge.cjs');
            const { buildReport, parseSlackIds, toMarkdown } =
              require('./.github/scripts/codeowners-pr-report.cjs');
            const dryRun = process.env.DRY_RUN !== 'false';
            core.setOutput('dry_run', String(dryRun));

            let report;
            try {
              const board = JSON.parse(
                fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'board.json'), 'utf8'),
              );
              const { prs, factsFor, notes } = await collectFacts({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              for (const note of notes) core.warning(note);
              const { ids, warning } = parseSlackIds(process.env.SLACK_IDS);
              if (warning) core.warning(warning);

              report = buildReport(board, new Map(prs.map((pr) => [pr.number, factsFor(pr)])), {
                now: Date.now(),
                slackIds: ids,
                runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              fs.writeFileSync(
                path.join(process.env.RUNNER_TEMP, 'slack-payload.json'),
                JSON.stringify({ text: report.text, blocks: report.blocks }),
              );
              core.info(`${report.counts.listed} PR(s) listed`);
            } finally {
              try {
                core.summary.addHeading(
                  dryRun ? 'Codeowners PR report (dry run, not posted)' : 'Codeowners PR report',
                );
                if (report) {
                  core.summary.addRaw(toMarkdown(report), true);
                } else {
                  core.summary.addRaw('The report could not be built; see the log.', true);
                }
                await core.summary.write();
              } catch (error) {
                core.warning(`Failed to write job summary: ${error.message}`);
              }
            }

      - name: Post to Slack
        if: steps.report.outputs.dry_run == 'false'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CODEOWNERS_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::error::SLACK_CODEOWNERS_WEBHOOK_URL isn't set, so the report can't be posted."
            exit 1
          fi
          response="$(mktemp)"
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output "$response" --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/slack-payload.json" "$SLACK_WEBHOOK_URL")
          # Slack answers a delivered message with HTTP 200 and the body "ok".
          if [[ "$status" != "200" || "$(cat "$response")" != "ok" ]]; then
            echo "::error::Slack rejected the report: HTTP $status $(head -c 300 "$response")"
            exit 1
          fi
          echo "Posted the report to Slack."
