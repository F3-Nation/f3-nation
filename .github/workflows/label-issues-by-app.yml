name: Label issues by app

on:
  issues:
    types: [opened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply app label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const appLabels = new Map([
              ['apps/admin', 'app: admin'],
              ['apps/api', 'app: api'],
              ['apps/auth', 'app: auth'],
              ['apps/homepage', 'app: homepage'],
              ['apps/map', 'app: map'],
              ['apps/me', 'app: me'],
              ['apps/slackbot', 'app: slackbot'],
            ]);

            const issue = context.payload.issue;
            const body = issue.body ?? '';
            const match = body.match(/^### Affected app\s+([^#\r\n]+)/im);

            if (!match) {
              core.warning(
                `Issue #${issue.number} has no "### Affected app" section; no app label applied. ` +
                  'Issues filed outside the issue forms (blank issues, gh issue create, transfers) need a manual label.',
              );
              return;
            }

            const selectedApp = match[1].trim();
            const selectedLabel = appLabels.get(selectedApp);

            if (!selectedLabel) {
              core.warning(
                `Issue #${issue.number}: "${selectedApp}" has no entry in this workflow's appLabels map. ` +
                  'Add it here, or remove the option from .github/ISSUE_TEMPLATE/{bug_report,feature_request}.yml.',
              );
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;
            const existingLabels = issue.labels.map((label) =>
              typeof label === 'string' ? label : label.name,
            );
            const allAppLabels = [...appLabels.values()];

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: selectedLabel,
                color: '5319e7',
                description: `Issue affects ${selectedApp}`,
              });
            } catch (error) {
              const alreadyExists =
                error?.status === 422 &&
                (error?.response?.data?.errors ?? []).some(
                  (e) => e.code === 'already_exists',
                );
              if (!alreadyExists) throw error;
            }

            const labelsToRemove = allAppLabels.filter(
              (label) => label !== selectedLabel && existingLabels.includes(label),
            );

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
              } catch (error) {
                // 404 => already removed by a concurrent run or a maintainer.
                if (error?.status !== 404) throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [selectedLabel],
            });
            core.info(`Applied "${selectedLabel}" to #${issue_number}.`);
