name: Label issues by app

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  label:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Apply app label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const appLabels = new Map([
              ['apps/admin', 'app: admin'],
              ['apps/api', 'app: api'],
              ['apps/auth', 'app: auth'],
              ['apps/homepage', 'app: homepage'],
              ['apps/map', 'app: map'],
              ['apps/me', 'app: me'],
              ['apps/slackbot', 'app: slackbot'],
            ]);

            const issue = context.payload.issue;
            const body = issue.body ?? '';
            const match = body.match(/### Affected app\s+([^#\r\n]+)/i);

            if (!match) {
              core.info('No affected app field found in issue body.');
              return;
            }

            const selectedApp = match[1].trim();
            const selectedLabel = appLabels.get(selectedApp);

            if (!selectedLabel) {
              core.info(`Affected app is not labelable: ${selectedApp}`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;
            const existingLabels = issue.labels.map((label) =>
              typeof label === 'string' ? label : label.name,
            );
            const allAppLabels = [...appLabels.values()];

            for (const label of allAppLabels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: '5319e7',
                  description: `Issue affects ${label.replace('app: ', 'apps/')}`,
                });
              }
            }

            const labelsToRemove = allAppLabels.filter(
              (label) => label !== selectedLabel && existingLabels.includes(label),
            );

            for (const label of labelsToRemove) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
            }

            if (!existingLabels.includes(selectedLabel)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [selectedLabel],
              });
            }
