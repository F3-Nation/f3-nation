name: Label issues by app

on:
  issues:
    types: [opened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply app label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const appLabels = new Map([
              ['apps/admin', 'app: admin'],
              ['apps/analytics', 'app: analytics'],
              ['apps/api', 'app: api'],
              ['apps/auth', 'app: auth'],
              ['apps/homepage', 'app: homepage'],
              ['apps/map', 'app: map'],
              ['apps/me', 'app: me'],
              ['apps/region-pages', 'app: region-pages'],
              ['apps/slackbot', 'app: slackbot'],
            ]);

            const issue = context.payload.issue;
            const body = issue.body ?? '';
            const match = body.match(/^### Affected app\s+([^#\r\n]+)/im);

            if (!match) {
              core.warning(
                `Issue #${issue.number} has no "### Affected app" section; no app label applied. ` +
                  'Issues filed outside the issue forms (blank issues, gh issue create, transfers) need a manual label.',
              );
              return;
            }

            // Options read "Map — map.f3nation.com (apps/map)"; older issues hold the bare path.
            const answer = match[1].trim();
            const selectedApp = answer.match(/\bapps\/[a-z0-9-]+/)?.[0];
            if (!selectedApp) {
              // Form options that intentionally name no app. Anything else came from an edited body,
              // so its text is never logged: it may hold personal details.
              const nonAppAnswers = new Set([
                'packages (shared code)',
                'repo / tooling / CI / deps',
                'Not sure / multiple',
              ]);
              if (nonAppAnswers.has(answer)) {
                core.info(`Issue #${issue.number} names no single app; no app label applied.`);
              } else {
                core.warning(
                  `Issue #${issue.number}: the "Affected app" answer matches no form option and holds no apps/<name> path; ` +
                    'no app label applied. Label it by hand, or end the option with "(apps/<name>)" in ' +
                    '.github/ISSUE_TEMPLATE/{bug_report,feature_request}.yml.',
                );
              }
              return;
            }
            const selectedLabel = appLabels.get(selectedApp);

            if (!selectedLabel) {
              core.warning(
                `Issue #${issue.number}: "${selectedApp}" has no entry in this workflow's appLabels map. ` +
                  'Add it here, or remove the option from .github/ISSUE_TEMPLATE/{bug_report,feature_request}.yml.',
              );
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;
            const existingLabels = issue.labels.map((label) =>
              typeof label === 'string' ? label : label.name,
            );
            const allAppLabels = [...appLabels.values()];

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: selectedLabel,
                color: '5319e7',
                description: `Issue affects ${selectedApp}`,
              });
            } catch (error) {
              const alreadyExists =
                error?.status === 422 &&
                (error?.response?.data?.errors ?? []).some(
                  (e) => e.code === 'already_exists',
                );
              if (!alreadyExists) throw error;
            }

            const labelsToRemove = allAppLabels.filter(
              (label) => label !== selectedLabel && existingLabels.includes(label),
            );

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
              } catch (error) {
                // 404 => already removed by a concurrent run or a maintainer.
                if (error?.status !== 404) throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [selectedLabel],
            });
            core.info(`Applied "${selectedLabel}" to #${issue_number}.`);
