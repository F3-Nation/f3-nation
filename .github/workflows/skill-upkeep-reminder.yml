name: Skill upkeep reminder

# Keeps one open issue reminding codeowners to check the agent skills in
# .agents/skills: a benchmark run for pr-review-inline on the current review
# model, and one real run of every other skill. scripts/skill-upkeep-issue.sh
# writes the issue body, oldest-changed skill first.
#
# Exactly one reminder is open at a time. The workflow finds it by the hidden
# marker line the script puts at the top of the body. If one is open, it
# refreshes the body and comments; otherwise it opens a new one. Ticked boxes
# are reset by a refresh, so a refresh comments to say so.
#
# Uses only GITHUB_TOKEN; it calls no AI model.

on:
  schedule:
    # 09:23 UTC on the first day of each month.
    - cron: "23 9 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  remind:
    if: github.repository_owner == 'F3-Nation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the skills and their history
      issues: write # open, edit and comment on the reminder issue
    steps:
      - name: Check out the skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the body dates each skill by its last commit.
          fetch-depth: 0

      - name: Write the issue body
        run: bash scripts/skill-upkeep-issue.sh --repo "$GITHUB_REPOSITORY" >"$RUNNER_TEMP/body.md"

      - name: Open or refresh the reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Must match MARKER in scripts/skill-upkeep-issue.sh and the --jq filter below.
          marker='<!-- skill-upkeep-reminder -->'
          if [[ "$(head -n 1 "$RUNNER_TEMP/body.md")" != "$marker" ]]; then
            echo "::error::The generated body doesn't start with the marker line, so the next run couldn't find this issue."
            exit 1
          fi

          # Lowest number first, so a duplicate left by hand never takes over.
          numbers="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            --jq '.[] | select(.pull_request == null) | select((.body // "") | startswith("<!-- skill-upkeep-reminder -->")) | .number' \
            | sort -n)"
          number="$(printf '%s\n' "$numbers" | head -n 1)"
          if [[ "$(printf '%s\n' "$numbers" | grep -c .)" -gt 1 ]]; then
            echo "::warning::More than one reminder is open ($(echo "$numbers" | tr '\n' ' ')); refreshing #$number. Close the others."
          fi

          month="$(date -u +'%B %Y')"
          if [[ -n "$number" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$number" \
              -F "body=@$RUNNER_TEMP/body.md" >/dev/null
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" \
              -f "body=Refreshed for ${month}: the skill list and dates are current again, and the boxes are cleared. Comments above still record what was checked. _Generated by the skill upkeep reminder workflow._" >/dev/null
            echo "Refreshed #$number."
          else
            url="$(gh api --method POST "repos/$GITHUB_REPOSITORY/issues" \
              -f "title=Monthly agent skill check" \
              -F "body=@$RUNNER_TEMP/body.md" --jq '.html_url')"
            echo "Opened $url."
          fi
