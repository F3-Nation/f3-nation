name: Deploy Homepage (Staging)

# Staging copy of the apps directory at https://staging.apps.f3nation.com.
# Production stays on GitHub Pages (deploy-homepage.yml, same trigger) and is
# untouched by this workflow.
#
# Why not ./_deploy-cloudrun.yml: that pipeline builds one image and promotes
# it unchanged to a production Cloud Run service. The homepage has no prod
# Cloud Run service, and its channel (NEXT_PUBLIC_CHANNEL) is inlined into the
# static export at build time, so the staging image can never be the prod
# artifact. This workflow keeps the same CI gate, WIF auth, Artifact Registry
# layout, image tag scheme, per-target concurrency group and deploy action as
# that pipeline's build + deploy-staging jobs, and stops there.
#
# One-time infra (Cloud Run service, domain mapping, DNS, environment vars):
# apps/homepage/README.md#staging.

on:
  push:
    tags:
      - "homepage@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)deploy, e.g. homepage@1.2.3"
        required: true
        type: string

# Same per-target group _deploy-cloudrun.yml uses (project + region + service),
# so two tags dispatched close together cannot race on the service.
concurrency:
  group: cloudrun-deploy-f3-map-app-staging-us-central1-f3-homepage
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Hosted in the map's staging project, reusing its map-staging GitHub
  # environment (WIF_PROVIDER / WIF_SA) instead of new credentials.
  STAGING_PROJECT: f3-map-app-staging
  REGION: us-central1
  AR_REPO: cloud-run-builds
  IMAGE_NAME: f3-homepage
  SERVICE_NAME: f3-homepage
  TAG_PREFIX: homepage@

jobs:
  # ── Gate: wait for the full CI check set to pass on this commit ──
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Validate deploy ref is an existing release tag
        if: inputs.tag != ''
        env:
          REF: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${REF}" != "${TAG_PREFIX}"* ]]; then
            echo "::error::ref '${REF}' does not start with expected tag prefix '${TAG_PREFIX}'"
            exit 1
          fi
          if ! gh api "repos/${{ github.repository }}/git/refs/tags/${REF}" >/dev/null 2>&1; then
            echo "::error::ref '${REF}' is not an existing release tag"
            exit 1
          fi

      # Same check set as _deploy-cloudrun.yml / deploy-homepage.yml; see the
      # notes there on lint-title and on redeploying older tags.
      - name: Wait for CI to pass
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-regexp: "^(build|lint|typecheck|format-check|test-coverage|security-audit|db-schema-sync)$"
          wait-interval: 15
          allowed-conclusions: success

  # ── Build the staging export, package it, deploy to Cloud Run ──
  deploy-staging:
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: map-staging
      url: https://staging.apps.f3nation.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build static export (staging channel)
        env:
          NEXT_PUBLIC_CHANNEL: staging
          # An API override would beat the channel default and point /org and
          # /status at another API; keep it empty so staging.api is used.
          NEXT_PUBLIC_API_URL: ""
          # Read-only org-chart key accepted by the staging API; set it on the
          # map-staging environment (README "Staging" step 4). The build
          # fails without it, since /org would ship unauthenticated.
          NEXT_PUBLIC_ORG_MAP_API_KEY: ${{ vars.HOMEPAGE_ORG_MAP_API_KEY }}
        run: |
          if [ -z "${NEXT_PUBLIC_ORG_MAP_API_KEY}" ]; then
            echo "::error::HOMEPAGE_ORG_MAP_API_KEY is not set on map-staging; /org requests would be unauthenticated"
            exit 1
          fi
          pnpm build --filter f3-homepage

      # Fail before shipping if the export still links production apps.
      - name: Assert the export links staging hosts only
        working-directory: apps/homepage/out
        run: |
          grep -q 'href="https://staging.map.f3nation.com"' index.html
          if grep -oE 'href="https://[a-z.-]*f3nation\.com[^"]*"' index.html \
              | grep -v -e 'href="https://staging\.' -e 'href="https://f3nation\.com"'; then
            echo "::error::staging export links a production host (above)"
            exit 1
          fi

      - name: Authenticate to GCP (staging)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Authorize Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        id: image
        env:
          DEPLOY_REF: ${{ inputs.tag }}
        run: |
          TAG="${DEPLOY_REF:-$GITHUB_REF_NAME}"  # e.g. homepage@1.2.3
          VERSION="${TAG#"${TAG_PREFIX}"}"       # e.g. 1.2.3
          IMAGE="${REGION}-docker.pkg.dev/${STAGING_PROJECT}/${AR_REPO}/${IMAGE_NAME}:${VERSION}"
          # Cloud Run only runs linux/amd64.
          docker build \
            --platform=linux/amd64 \
            --file apps/homepage/cloudrun/Dockerfile \
            --build-context site=apps/homepage/out \
            --tag "${IMAGE}" \
            apps/homepage/cloudrun
          docker push "${IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run (staging)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ steps.image.outputs.image }}
          region: ${{ env.REGION }}
          project_id: ${{ env.STAGING_PROJECT }}
          # deploy-cloudrun v3 defaults wait to false; keep waiting for the revision to be healthy
          wait: "true"
          flags: "--max-instances=2"

      - name: Smoke-test the new revision
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          body=$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 30 "${URL%/}/")
          grep -q 'href="https://staging.map.f3nation.com"' <<<"${body}" \
            || { echo "::error::${URL} did not serve the staging directory"; exit 1; }
          curl --fail --silent --show-error --max-time 30 -o /dev/null "${URL%/}/status/"
          curl --fail --silent --show-error --max-time 30 -o /dev/null "${URL%/}/org/"
