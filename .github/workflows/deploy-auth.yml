name: Deploy Auth

on:
  push:
    tags:
      - "auth@*"

# Prevent concurrent deploys of the same tag
concurrency:
  group: deploy-auth-${{ github.ref_name }}
  cancel-in-progress: false

# Reusable workflows can't elevate GITHUB_TOKEN beyond what the caller grants.
# id-token: write -> GCP OIDC (google-github-actions/auth); checks: read -> CI gate;
# issues: write -> file the post-staging-deploy smoke-test issue.
permissions:
  contents: read
  id-token: write
  checks: read
  issues: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      image_name: f3-auth
      service_name: f3-auth
      staging_project: f3-authentication-staging
      prod_project: f3-authentication
      tag_prefix: auth@
      dockerfile: apps/auth/Dockerfile
      staging_environment: auth-staging
      prod_environment: auth-production
      staging_url: https://staging.auth2.f3nation.com
      prod_url: https://auth.f3nation.com
      smoke_test_app: auth
      app_label: "app: auth"
      # Stop-gap for in-memory rate limiter: pin to a single instance so the
      # per-process Map store is authoritative across all requests.  When the
      # limiter is migrated to a shared store (Redis/Upstash) this flag can be
      # removed or raised.  See #356.
      flags: "--min-instances=1 --max-instances=1"
