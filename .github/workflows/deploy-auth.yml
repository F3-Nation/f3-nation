name: Deploy Auth

on:
  push:
    tags:
      - "auth@*"

# Prevent concurrent deploys of the same tag
concurrency:
  group: deploy-auth-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      image_name: f3-auth
      service_name: f3-auth
      staging_project: f3-authentication-staging
      prod_project: f3-authentication
      tag_prefix: auth@
      dockerfile: apps/auth/Dockerfile
      staging_environment: auth-staging
      prod_environment: auth-production
      staging_url: https://staging.auth.f3nation.com
      prod_url: https://auth.f3nation.com
