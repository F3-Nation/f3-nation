name: Reusable Cloud Run Deploy

# Reusable pipeline shared by every Cloud Run app (me, admin, auth, ...).
# ci-gate -> build image once -> deploy staging -> promote + deploy prod.
# Callers (deploy-*.yml) only pass app-specific inputs; behavior stays identical
# across apps so the workflows can never drift again.

on:
  workflow_call:
    inputs:
      image_name:
        description: "Artifact Registry image name (e.g. f3-me)"
        required: true
        type: string
      service_name:
        description: "Cloud Run service name"
        required: true
        type: string
      staging_project:
        description: "GCP project ID for staging"
        required: true
        type: string
      prod_project:
        description: "GCP project ID for production"
        required: true
        type: string
      tag_prefix:
        description: "Tag prefix to strip for the image version (e.g. me@)"
        required: true
        type: string
      dockerfile:
        description: "Path to the app Dockerfile"
        required: true
        type: string
      build_context:
        description: "Docker build context path"
        required: false
        type: string
        default: "."
      staging_environment:
        description: "GitHub Environment name for staging"
        required: true
        type: string
      prod_environment:
        description: "GitHub Environment name for production"
        required: true
        type: string
      staging_url:
        description: "Public staging URL"
        required: false
        type: string
        default: ""
      prod_url:
        description: "Public production URL"
        required: false
        type: string
        default: ""
      region:
        description: "GCP region"
        required: false
        type: string
        default: us-central1
      ar_repo:
        description: "Artifact Registry repository"
        required: false
        type: string
        default: cloud-run-builds
      flags:
        description: "Extra flags passed directly to gcloud run deploy (e.g. --max-instances=1)"
        required: false
        type: string
        default: ""
      staging_flags:
        description: "Staging-only flags passed directly to gcloud run deploy; falls back to flags when empty"
        required: false
        type: string
        default: ""
      prod_flags:
        description: "Production-only flags passed directly to gcloud run deploy; falls back to flags when empty"
        required: false
        type: string
        default: ""
      revalidate_after_deploy:
        description: "POST /api/revalidate after a healthy deploy to warm the static cache"
        required: false
        type: boolean
        default: false
      revalidate_secret_name:
        description: "Secret Manager secret ID holding the x-api-key for /api/revalidate"
        required: false
        type: string
        default: SUPER_ADMIN_API_KEY
      smoke_test_app:
        description: >-
          Section key matching a "## <key>" heading in .github/smoke-tests/checklists.md
          to sync into the staging smoke-test tracker issue after a successful staging
          deploy; empty skips
        required: false
        type: string
        default: ""
      app_label:
        description: "Existing 'app: X' label to apply to the staging smoke-test tracker issue"
        required: false
        type: string
        default: ""

jobs:
  # ── Gate: wait for the full CI check set to pass on this commit ──
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Wait for CI to pass
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-regexp: "^(build|lint|typecheck|format-check|test-coverage)$"
          wait-interval: 15
          allowed-conclusions: success

  # ── Build container image (once) ──
  build:
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.staging_environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to GCP (staging project for AR)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Authorize Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev --quiet

      - name: Extract tag version
        id: meta
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          REGION: ${{ inputs.region }}
          STAGING_PROJECT: ${{ inputs.staging_project }}
          AR_REPO: ${{ inputs.ar_repo }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. me@1.2.3
          VERSION="${TAG#"${TAG_PREFIX}"}"  # e.g. 1.2.3
          IMAGE="${REGION}-docker.pkg.dev/${STAGING_PROJECT}/${AR_REPO}/${IMAGE_NAME}:${VERSION}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
        run: |
          TURBO_VERSION=$(grep '^  turbo:' pnpm-workspace.yaml | awk '{print $2}')
          # Cloud Run only runs linux/amd64. The Dockerfile FROM lines no longer
          # pin --platform (BuildKit lint), so the target arch is set here.
          docker build \
            --platform=linux/amd64 \
            --file "${DOCKERFILE}" \
            --build-arg TURBO_VERSION="${TURBO_VERSION}" \
            --tag "${{ steps.meta.outputs.image }}" \
            "${BUILD_CONTEXT}"
          docker push "${{ steps.meta.outputs.image }}"

  # ── Deploy to staging ──
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.staging_environment }}
      url: ${{ inputs.staging_url }}
    steps:
      - name: Authenticate to GCP (staging)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}

      - name: Deploy to Cloud Run (staging)
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ inputs.service_name }}
          image: ${{ needs.build.outputs.image }}
          region: ${{ inputs.region }}
          project_id: ${{ inputs.staging_project }}
          # deploy-cloudrun v3 defaults wait to false; keep waiting for the revision to be healthy
          wait: "true"
          flags: ${{ inputs.staging_flags || inputs.flags }}
          # Env vars are set via Cloud Run secrets / env config (see scripts/cloud-run-env.sh)

      - name: Set up Cloud SDK (staging revalidation)
        if: inputs.revalidate_after_deploy
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Warm static cache (staging)
        if: inputs.revalidate_after_deploy
        env:
          PROJECT: ${{ inputs.staging_project }}
          URL: ${{ inputs.staging_url }}
          SECRET_NAME: ${{ inputs.revalidate_secret_name }}
        run: |
          KEY="$(gcloud secrets versions access latest --secret="${SECRET_NAME}" --project="${PROJECT}")" \
            || { echo "::warning::Could not read ${SECRET_NAME}; skipping cache warm"; exit 0; }
          raw=$(curl -sS -w '\n%{http_code}' -X POST "${URL%/}/api/revalidate" -H "x-api-key: ${KEY}") \
            || raw=$'\ncurl_failed'
          code=$(printf '%s' "${raw}" | tail -n1)
          body=$(printf '%s' "${raw}" | sed '$d')
          echo "Revalidation POST ${URL%/}/api/revalidate -> ${code}"
          if [ "${code}" != "200" ]; then
            echo "::warning::Cache revalidation returned HTTP ${code}"
          elif [ "$(printf '%s' "${body}" | jq -r '.warmed // false')" != "true" ]; then
            echo "::warning::Cache revalidated but warm-up did not complete; instance will regenerate lazily on next visit"
          fi

  # ── Update the shared staging smoke-test tracker issue after a successful staging deploy ──
  smoke-test-issue:
    needs: [build, deploy-staging]
    if: inputs.smoke_test_app != ''
    runs-on: ubuntu-latest
    # Static (non-templated) group: serializes this job across every app's
    # deploy workflow so two apps deploying around the same time can't both
    # decide "no open tracker issue" and each create a duplicate.
    concurrency:
      group: staging-smoke-test-tracker
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/staging-smoke-test-issue
        with:
          service_name: ${{ inputs.service_name }}
          version: ${{ needs.build.outputs.version }}
          staging_url: ${{ inputs.staging_url }}
          app_key: ${{ inputs.smoke_test_app }}
          app_label: ${{ inputs.app_label }}
          github_token: ${{ github.token }}

  # ── Deploy to production (requires approval) ──
  deploy-prod:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.prod_environment }}
      url: ${{ inputs.prod_url }}
    steps:
      - name: Authenticate to GCP (staging — pull image from staging AR)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Promote image to production Artifact Registry
        env:
          REGION: ${{ inputs.region }}
          PROD_PROJECT: ${{ inputs.prod_project }}
          AR_REPO: ${{ inputs.ar_repo }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          STAGING_IMAGE="${{ needs.build.outputs.image }}"
          PROD_IMAGE="${REGION}-docker.pkg.dev/${PROD_PROJECT}/${AR_REPO}/${IMAGE_NAME}:${STAGING_IMAGE##*:}"
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          docker pull "${STAGING_IMAGE}"
          docker tag "${STAGING_IMAGE}" "${PROD_IMAGE}"
          docker push "${PROD_IMAGE}"
          echo "prod_image=${PROD_IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run (prod)
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ inputs.service_name }}
          image: ${{ env.prod_image }}
          region: ${{ inputs.region }}
          project_id: ${{ inputs.prod_project }}
          # deploy-cloudrun v3 defaults wait to false; keep waiting for the revision to be healthy
          wait: "true"
          flags: ${{ inputs.prod_flags || inputs.flags }}

      - name: Warm static cache (prod)
        if: inputs.revalidate_after_deploy
        env:
          PROJECT: ${{ inputs.prod_project }}
          URL: ${{ inputs.prod_url }}
          SECRET_NAME: ${{ inputs.revalidate_secret_name }}
        run: |
          KEY="$(gcloud secrets versions access latest --secret="${SECRET_NAME}" --project="${PROJECT}")" \
            || { echo "::warning::Could not read ${SECRET_NAME}; skipping cache warm"; exit 0; }
          raw=$(curl -sS -w '\n%{http_code}' -X POST "${URL%/}/api/revalidate" -H "x-api-key: ${KEY}") \
            || raw=$'\ncurl_failed'
          code=$(printf '%s' "${raw}" | tail -n1)
          body=$(printf '%s' "${raw}" | sed '$d')
          echo "Revalidation POST ${URL%/}/api/revalidate -> ${code}"
          if [ "${code}" != "200" ]; then
            echo "::warning::Cache revalidation returned HTTP ${code}"
          elif [ "$(printf '%s' "${body}" | jq -r '.warmed // false')" != "true" ]; then
            echo "::warning::Cache revalidated but warm-up did not complete; instance will regenerate lazily on next visit"
          fi
