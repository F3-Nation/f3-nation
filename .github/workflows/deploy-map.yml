name: Deploy Map

on:
  push:
    tags:
      - "map@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)deploy, e.g. map@1.2.3"
        required: true
        type: string

# Prevent concurrent deploys of the same tag
concurrency:
  group: deploy-map-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Reusable workflows can't elevate GITHUB_TOKEN beyond what the caller grants.
# id-token: write -> GCP OIDC (google-github-actions/auth); checks: read -> CI gate.
permissions:
  contents: read
  id-token: write
  checks: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      ref: ${{ inputs.tag }}
      image_name: f3-map
      service_name: f3-map
      staging_project: f3-map-app-staging
      prod_project: f3-map-app
      tag_prefix: map@
      dockerfile: apps/map/Dockerfile
      staging_environment: map-staging
      prod_environment: map-production
      staging_url: https://staging.map.f3nation.com
      prod_url: https://map.f3nation.com
      revalidate_after_deploy: true
      # `|| 'false'` is load-bearing, not defensive noise: when the repo
      # variable is unset this expression yields an EMPTY STRING, and an
      # explicitly-passed empty input overrides the reusable workflow's
      # `default: "false"` rather than falling back to it. That empty string
      # reaches env.ts as NEXT_PUBLIC_POSTHOG_SESSION_RECORDING="", which
      # z.enum(["true","false"]).optional() rejects — and since it is inlined
      # into the CLIENT bundle, where skipValidation's CI/SKIP_ENV_VALIDATION
      # escape hatches are both absent, it throws in the browser on import.
      posthog_session_recording: ${{ vars.POSTHOG_SESSION_RECORDING || 'false' }}
      # Bound instances x per-instance db pool below the pooler's client
      # ceiling — sizing rationale in docs/AI_DEVELOPMENT_GUIDE.md ("Data layer").
      flags: "--max-instances=25"
    secrets:
      posthog_key: ${{ secrets.POSTHOG_KEY }}

  # Staging allows the dev-mode sign-in (a nation-admin login); Production must
  # never have it. The image is promoted unchanged from Staging, so assert it
  # against the live Production service after every deploy, including one that
  # fails after the new revision started serving.
  verify-prod-no-dev-mode:
    needs: deploy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Assert Production does not register the dev-mode sign-in
        run: |
          providers=$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 30 \
            https://map.f3nation.com/api/auth/providers)
          # Validate the response first: jq -e on non-JSON would otherwise read
          # as "no dev-mode" and pass.
          if ! jq -e 'type == "object" and has("email")' <<<"$providers" >/dev/null; then
            echo "::error::Unexpected /api/auth/providers response: ${providers}"
            exit 1
          fi
          if jq -e 'has("dev-mode")' <<<"$providers" >/dev/null; then
            # The cause is usually the service env, not the revision, so a
            # rollback may not help. Report the channel the service is running.
            channel=$(curl --silent --max-time 30 https://map.f3nation.com/api/runtime-config \
              | jq -r '.channel // "unreadable"' 2>/dev/null || echo unreadable)
            echo "::error::Production map registers the dev-mode sign-in provider (runtime F3_CHANNEL: ${channel}). Fix F3_CHANNEL on the Production service; if it is already prod, roll back the revision."
            exit 1
          fi
          echo "Production providers: $(jq -c 'keys' <<<"$providers")"
