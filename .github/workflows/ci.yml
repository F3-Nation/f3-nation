name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

permissions:
  contents: read

env:
  CI: true
  # Turborepo Remote Cache. TURBO_TOKEN is a secret; TURBO_TEAM is the
  # remote-cache team slug (repo variable). With both set, every job/run/rerun
  # shares task outputs, so unchanged work short-circuits to FULL TURBO.
  # Absent (e.g. fork PRs without secrets) Turbo silently falls back to local-only caching.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: 1
  # Database (for test jobs - matches PostgreSQL service)
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/f3_test
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/f3_test
  # Auth (mock)
  AUTH_SECRET: ci-auth-secret-placeholder-32chars
  # Email (mocks)
  EMAIL_SERVER: smtp://user:pass@localhost:587
  EMAIL_FROM: ci@example.com
  EMAIL_ADMIN_DESTINATIONS: ci@example.com
  # Google (mocks)
  GCS_CREDENTIALS: eyJjbGllbnRfZW1haWwiOiJtb2NrQGV4YW1wbGUuaWFtLmdzZXJ2aWNlYWNjb3VudC5jb20iLCJwcml2YXRlX2tleSI6Ii0tLS0tQkVHSU4gUlNBIFBSSVZBVEUgS0VZLS0tLS1cbmZha2Vcbi0tLS0tRU5EIFJTQSBQUklWQVRFIEtFWS0tLS0tIn0=
  # API (mocks)
  API_KEY: ci-api-key-placeholder
  SUPER_ADMIN_API_KEY: ci-super-admin-key-placeholder
  # Next.js (mocks)
  NEXT_PUBLIC_API_URL: http://localhost:3001
  NEXT_PUBLIC_MAP_URL: http://localhost:3000
  NEXT_PUBLIC_CHANNEL: ci
  NEXT_PUBLIC_GOOGLE_API_KEY: ci-google-api-key-placeholder
  NEXT_PUBLIC_MAP_API_KEY: ci-map-api-key-placeholder
  F3_CHANNEL: ci

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm format

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm audit --prod --audit-level=high

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm build

  test-coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:29ee7bb30d804447dc9a91fd0d74322ae1dc3a4072cc6346f70a5ed6e783b565
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: f3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm test
