name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CI: true
  # Turborepo Remote Cache. TURBO_TOKEN is a secret; TURBO_TEAM is the
  # remote-cache team slug (repo variable). With both set, every job/run/rerun
  # shares task outputs, so unchanged work short-circuits to FULL TURBO.
  # Absent (e.g. fork PRs without secrets) Turbo silently falls back to local-only caching.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: 1
  # Database (for test jobs - matches PostgreSQL service)
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/f3_test
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/f3_test
  # Auth (mock)
  AUTH_SECRET: ci-auth-secret-placeholder-32chars
  # Email (mocks)
  EMAIL_SERVER: smtp://user:pass@localhost:587
  EMAIL_FROM: ci@example.com
  EMAIL_ADMIN_DESTINATIONS: ci@example.com
  # API (mocks)
  API_KEY: ci-api-key-placeholder
  SUPER_ADMIN_API_KEY: ci-super-admin-key-placeholder
  # Next.js (mocks)
  NEXT_PUBLIC_API_URL: http://localhost:3001
  NEXT_PUBLIC_MAP_URL: http://localhost:3000
  NEXT_PUBLIC_CHANNEL: ci
  NEXT_PUBLIC_GOOGLE_API_KEY: ci-google-api-key-placeholder
  NEXT_PUBLIC_MAP_API_KEY: ci-map-api-key-placeholder
  F3_CHANNEL: ci

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: ./.github/actions/setup
        with:
          select-turbo-affected: "true"
          turbo-task: format
      - run: pnpm format ${TURBO_RUN_ARGS:+"$TURBO_RUN_ARGS"}

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level=high

  recent-package-watch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build recent release report
        id: report
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const path = require('node:path');
          const cp = require('node:child_process');

          const importers = JSON.parse(
            cp.execFileSync('pnpm', ['list', '--json', '--depth', '0', '--prod', '--dev'], {
              encoding: 'utf8',
              maxBuffer: 20 * 1024 * 1024,
            }),
          );

          const workspaceRefs = new Map();

          for (const importer of importers) {
            const references = [
              ...(importer.dependencies ? Object.values(importer.dependencies) : []),
              ...(importer.unsavedDependencies ? Object.values(importer.unsavedDependencies) : []),
            ];

            for (const dependency of references) {
              const dependencyPath = dependency?.path;

              if (
                typeof dependencyPath !== 'string' ||
                !dependencyPath.includes(`${path.sep}node_modules${path.sep}.pnpm${path.sep}`)
              ) {
                continue;
              }

              let packageJson;

              try {
                packageJson = JSON.parse(fs.readFileSync(path.join(dependencyPath, 'package.json'), 'utf8'));
              } catch {
                continue;
              }

              if (!packageJson?.name || !packageJson?.version) {
                continue;
              }

              const packageKey = `${packageJson.name}@${packageJson.version}`;
              const referencesForPackage = workspaceRefs.get(packageKey) ?? {
                name: packageJson.name,
                version: packageJson.version,
                workspaces: new Set(),
              };

              referencesForPackage.workspaces.add(importer.name ?? importer.path ?? 'workspace');
              workspaceRefs.set(packageKey, referencesForPackage);
            }
          }

          const cutoffTime = Date.now() - 3 * 24 * 60 * 60 * 1000;
          const recentPackages = [];
          const failedChecks = [];

          for (const { name, version, workspaces } of workspaceRefs.values()) {
            let timeData;

            try {
              timeData = JSON.parse(  
                cp.execFileSync('npm', ['view', `${name}@${version}`, 'time', '--json'], {  
                  encoding: 'utf8',  
                  timeout: 15000,  
                  maxBuffer: 2 * 1024 * 1024,  
                }),  
              );  
            } catch (error) {
              const timedOut =
                error?.code === 'ETIMEDOUT' ||
                error?.signal === 'SIGTERM' ||
                /timed out/i.test(String(error?.message ?? ''));

              failedChecks.push({
                name,
                version,
                reason: timedOut ? 'timeout' : `error (${error?.code ?? 'unknown'})`,
              });

              continue;
            }

            const publishedAt = timeData?.[version];

            if (!publishedAt) {
              continue;
            }

            const publishedTime = Date.parse(publishedAt);

            if (!Number.isFinite(publishedTime) || publishedTime < cutoffTime) {
              continue;
            }

            recentPackages.push({
              name,
              version,
              publishedAt,
              workspaces: Array.from(workspaces).sort((left, right) => left.localeCompare(right)),
            });
          }

          recentPackages.sort(
            (left, right) => Date.parse(right.publishedAt) - Date.parse(left.publishedAt) || left.name.localeCompare(right.name),
          );

          const lines = [
            '<!-- recent-package-watch -->',
            '### Recently published dependencies',
            '',
          ];

          if (recentPackages.length === 0) {
            lines.push('No workspace dependency versions were published in the last 3 days.');
          } else {
            lines.push(`Found ${recentPackages.length} package${recentPackages.length === 1 ? '' : 's'} published in the last 3 days:`);
            lines.push('');

            for (const packageEntry of recentPackages) {
              lines.push(
                `- \`${packageEntry.name}@${packageEntry.version}\` published ${packageEntry.publishedAt.slice(0, 10)} in ${packageEntry.workspaces.join(', ')}`,
              );
            }
          }

          lines.push('');
          lines.push('### Publish-time check health');
          lines.push('');

          if (failedChecks.length === 0) {
            lines.push('All package publish-time checks completed successfully.');
          } else {
            lines.push(
              `Failed to fetch publish-time metadata for ${failedChecks.length} package${failedChecks.length === 1 ? '' : 's'}:`,
            );
            lines.push('');

            for (const failure of failedChecks) {
              lines.push(`- \`${failure.name}@${failure.version}\`: ${failure.reason}`);
            }
          }

          lines.push('');

          const body = lines.join('\n');
          const delimiter = 'EOF';

          process.stdout.write(`comment_body<<${delimiter}\n${body}\n${delimiter}\n`);
          NODE
      - name: Upsert PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- recent-package-watch -->';
            const body = `${process.env.COMMENT_BODY}`;
            const actor = (process.env.GITHUB_ACTOR ?? context.actor ?? '').toLowerCase();
            const botLogin = 'github-actions[bot]';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existingComment = comments.find((comment) => {
              const commentAuthor = (comment.user?.login ?? '').toLowerCase();

              return (
                comment.body?.includes(marker) &&
                (commentAuthor === botLogin || commentAuthor === actor)
              );
            });

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

        env:
          COMMENT_BODY: ${{ steps.report.outputs.comment_body }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: ./.github/actions/setup
        with:
          select-turbo-affected: "true"
          turbo-task: lint
      - run: pnpm lint ${TURBO_RUN_ARGS:+"$TURBO_RUN_ARGS"}
      - run: pnpm lint:unused

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: ./.github/actions/setup
        with:
          select-turbo-affected: "true"
          turbo-task: typecheck
      - run: pnpm typecheck ${TURBO_RUN_ARGS:+"$TURBO_RUN_ARGS"}

  # Regenerates Drizzle migrations from packages/db/drizzle/schema.ts and fails
  # if the output differs from what's committed. Exists because a snapshot can
  # silently go stale in an unrelated PR (a contributor's local schema.ts is
  # behind main when they run `drizzle-kit generate`, so the new snapshot bakes
  # in an out-of-date field) and then sit unnoticed on main for weeks until the
  # next `generate` run re-emits the transformation as a spurious "new"
  # migration. That happened with the request_type enum: it drifted in the
  # 0018/0019 snapshots and only surfaced when PR #845 generated 0020, an exact
  # duplicate of 0017. This job catches that class of drift at PR time instead.
  db-schema-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Regenerate migrations and diff against what's committed
        working-directory: packages/db
        run: |
          # A rename-shaped change (column/table/enum) needs drizzle-kit to
          # disambiguate rename-vs-drop+create interactively. In CI's non-TTY
          # shell that prompt throws instead -- but only to stderr, with exit
          # 0 and no file written, so a plain exit-code/git-status check goes
          # green while the migration silently never gets generated. Catch
          # both: a real crash, and this silent-success-with-stderr shape.
          if ! pnpm exec drizzle-kit generate 2>drizzle-kit-stderr.log; then
            cat drizzle-kit-stderr.log >&2
            echo "::error::drizzle-kit generate exited non-zero"
            exit 1
          fi
          if [ -s drizzle-kit-stderr.log ]; then
            echo "::error::drizzle-kit generate wrote to stderr but reported success (exit 0). This happens when it needs an interactive prompt (e.g. disambiguating a column/table/enum rename) that CI's non-TTY shell can't answer. Resolve the rename locally, where drizzle-kit can prompt you, then commit the generated migration."
            cat drizzle-kit-stderr.log >&2
            exit 1
          fi
          rm -f drizzle-kit-stderr.log
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::drizzle-kit generate produced migration/snapshot output that doesn't match what's committed under packages/db/drizzle. This usually means schema.ts changed without regenerating migrations, or a stale local snapshot got committed on an earlier PR. Run 'pnpm --filter @acme/db generate' on a branch rebased on latest main, review the diff, and commit the result."
            git status --porcelain -- drizzle
            # Intent-to-add so brand-new migration files (the most likely
            # failure shape - see #862) show their full content below instead
            # of being silently omitted: `git diff` skips untracked files.
            git add -N -- drizzle
            git --no-pager diff -- drizzle
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: ./.github/actions/setup
        with:
          select-turbo-affected: "true"
          turbo-task: build
      - run: pnpm build ${TURBO_RUN_ARGS:+"$TURBO_RUN_ARGS"}

  test-coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: f3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: ./.github/actions/setup
        with:
          select-turbo-affected: "true"
          turbo-task: test
      # GCS_CREDENTIALS must exist with client_email/private_key fields, but
      # nothing real is needed. Built here from plainly fake JSON — a committed
      # base64 blob trips generic high-entropy secret scanners.
      - name: Set mock GCS credentials
        run: echo "GCS_CREDENTIALS=$(printf '{\"client_email\":\"fake-not-a-real-credential@ci.invalid\",\"private_key\":\"THIS-IS-A-FAKE-PLACEHOLDER-FOR-CI\"}' | base64 -w0)" >> "$GITHUB_ENV"
      - run: pnpm test ${TURBO_RUN_ARGS:+"$TURBO_RUN_ARGS"}
      # The apps/api characterization matrix — the parity gate for the Hono
      # port. Runs in this job, sequentially after pnpm test and never
      # concurrent with it, because both suites mutate f3_test. Needs no extra
      # env: global-setup.ts stands up its own JWKS server and signing key, and
      # SUPER_ADMIN_API_KEY is already in the workflow env above.
      - run: pnpm turbo run test:characterization --filter=f3-api

  # Builds each app's deploy image the same way the release pipeline does
  # (turbo prune -> frozen install -> turbo build). The `build` job above is
  # affected-scoped on PRs; it cannot catch breakage that is specific to the
  # pruned Docker context (e.g. catalog mismatches or deps that resolve
  # transitively in the workspace install but not under the isolated linker).
  # This surfaces those at PR time instead of at release. No image push —
  # building the image is the validation. PRs import the per-app GHCR layer
  # cache read-only; docker-cache-refresh updates it only from main.
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        app: [admin, analytics, api, auth, map, me, slackbot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Set GHCR cache reference
        id: cache
        env:
          APP: ${{ matrix.app }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_name="${repository_name,,}"
          echo "ref=ghcr.io/${owner}/${repository_name}-ci-cache-${APP}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        id: login
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Warn if GHCR login failed
        if: steps.login.outcome == 'failure'
        run: echo "::warning::GHCR login failed; Docker will build without the shared cache."
      - id: build
        if: steps.login.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # Cloud Run only runs linux/amd64. The Dockerfile FROM lines no longer
          # pin --platform (BuildKit lint), so the target arch is set here.
          platforms: linux/amd64
          push: false
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
      - name: Warn if the registry cache could not be used
        if: steps.login.outcome == 'success' && steps.build.outcome == 'failure'
        run: echo "::warning::Cached Docker validation failed; retrying without the shared cache."
      # Registry cache availability is an optimization, not a correctness
      # requirement. Login failure skips the cache attempt entirely.
      - name: Validate image without registry cache
        if: steps.login.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: false
      # A cache import failure must not prevent an otherwise valid image build.
      - name: Retry without registry cache
        if: steps.login.outcome == 'success' && steps.build.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: false

  # Only trusted main-branch code may update the shared registry cache. Keeping
  # this separate from docker-build gives pull_request jobs packages:read and
  # prevents branches from racing to overwrite the same mutable cache tag. The
  # workflow-level concurrency group also serializes writers on main.
  docker-cache-refresh:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [admin, api, auth, map, me, slackbot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Set GHCR cache reference
        id: cache
        env:
          APP: ${{ matrix.app }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_name="${repository_name,,}"
          echo "ref=ghcr.io/${owner}/${repository_name}-ci-cache-${APP}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        id: login
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Warn if GHCR login failed
        if: steps.login.outcome == 'failure'
        run: echo "::warning::GHCR login failed; Docker will build without refreshing the shared cache."
      - id: build
        if: steps.login.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max,oci-mediatypes=true,image-manifest=true
      # Login failure disables the registry optimization, but must not skip the
      # image validation performed by this job.
      - name: Validate image without registry cache
        if: steps.login.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: false
      # A cached build or export failure must not prevent image validation.
      # Retry without importing the stale cache, but attempt to export the clean
      # build so later runs can use it. A failed repair remains non-blocking only
      # after a final uncached build proves the image itself is valid.
      - name: Repair cache without importing it
        id: repair
        if: steps.login.outcome == 'success' && steps.build.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: false
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max,oci-mediatypes=true,image-manifest=true
      - name: Warn if the shared cache was not refreshed
        if: steps.login.outcome == 'success' && steps.build.outcome == 'failure' && steps.repair.outcome == 'failure'
        run: echo "::warning::GHCR cache export failed; validating the image without cache before continuing."
      - name: Validate image after cache refresh failure
        if: steps.login.outcome == 'success' && steps.build.outcome == 'failure' && steps.repair.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: false
