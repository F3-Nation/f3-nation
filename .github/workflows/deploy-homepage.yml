name: Deploy Homepage

on:
  push:
    tags:
      - "homepage@*"

# Single GitHub Pages site: serialize all deploys through one group so a slower
# older-tag run can't publish after a newer one. (cancel-in-progress: false lets
# an in-flight production deploy finish.)
concurrency:
  group: deploy-homepage
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  # ── Gate: wait for CI to pass on this commit ──
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to pass
        uses: lewagon/wait-on-check-action@v1.7.0
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-regexp: "^(build|lint|typecheck|format-check|test-coverage)$"
          wait-interval: 15
          allowed-conclusions: success

  # ── Build static export ──
  build:
    needs: ci-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build --filter f3-homepage

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/homepage/out

  # ── Deploy to GitHub Pages ──
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
