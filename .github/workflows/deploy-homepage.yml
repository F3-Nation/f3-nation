name: Deploy Homepage

on:
  push:
    tags:
      - "homepage@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)deploy, e.g. homepage@1.2.3"
        required: true
        type: string

# Single GitHub Pages site: serialize all deploys through one group so a slower
# older-tag run can't publish after a newer one. (cancel-in-progress: false lets
# an in-flight production deploy finish.)
concurrency:
  group: deploy-homepage
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  # ── Gate: wait for CI to pass on this commit ──
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy tag is an existing release tag
        if: inputs.tag != ''
        env:
          REF: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${REF}" != "homepage@"* ]]; then
            echo "::error::tag '${REF}' does not start with expected prefix 'homepage@'"
            exit 1
          fi
          if ! gh api "repos/${{ github.repository }}/git/refs/tags/${REF}" >/dev/null 2>&1; then
            echo "::error::tag '${REF}' is not an existing release tag"
            exit 1
          fi

      # lint-title is deliberately excluded: it only runs on `pull_request`
      # (pr-title.yml has no `push` trigger), so it never has a check-run
      # against a commit reached via tag push -- waiting on it here would
      # hang until timeout, not deploy.
      #
      # NOTE: wait-on-check-action only fails when the filtered check list is
      # completely empty (fail-on-no-checks). Redeploying a tag older than the
      # newest required check (e.g. db-schema-sync, added 2026-08-18) passes
      # ci-check using only the checks that existed at that tag's commit --
      # newer required checks are silently skipped, not failed.
      - name: Wait for CI to pass
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-regexp: "^(build|lint|typecheck|format-check|test-coverage|test-coverage-hono|security-audit|db-schema-sync)$"
          wait-interval: 15
          allowed-conclusions: success

  # ── Build static export ──
  build:
    needs: ci-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build static export
        run: pnpm build --filter f3-homepage

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/homepage/out

  # ── Deploy to GitHub Pages ──
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        id: deployment
