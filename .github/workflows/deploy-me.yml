name: Deploy Me

on:
  push:
    tags:
      - "me@*"

# Prevent concurrent deploys of the same tag
concurrency:
  group: deploy-me-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      image_name: f3-me
      service_name: f3-me
      staging_project: f3-me-app-staging
      prod_project: f3-me-app
      tag_prefix: me@
      dockerfile: apps/me/Dockerfile
      staging_environment: me-staging
      prod_environment: me-production
      staging_url: https://staging.me.f3nation.com
      prod_url: https://me.f3nation.com
