name: Deploy Me

on:
  push:
    tags:
      - "me@*"

# Prevent concurrent deploys of the same tag
concurrency:
  group: deploy-me-${{ github.ref_name }}
  cancel-in-progress: false

# Reusable workflows can't elevate GITHUB_TOKEN beyond what the caller grants.
# id-token: write -> GCP OIDC (google-github-actions/auth); checks: read -> CI gate;
# issues: write -> file the post-staging-deploy smoke-test issue.
permissions:
  contents: read
  id-token: write
  checks: read
  issues: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      image_name: f3-me
      service_name: f3-me
      staging_project: f3-me-app-staging
      prod_project: f3-me-app
      tag_prefix: me@
      dockerfile: apps/me/Dockerfile
      staging_environment: me-staging
      prod_environment: me-production
      staging_url: https://staging.me.f3nation.com
      prod_url: https://me.f3nation.com
      smoke_test_file: .github/smoke-tests/me.md
      app_label: "app: me"
