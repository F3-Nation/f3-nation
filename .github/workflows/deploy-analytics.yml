name: Deploy Analytics ETL

on:
  push:
    tags:
      - "analytics@*"

concurrency:
  group: deploy-analytics-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  checks: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-cloudrun-job.yml
    with:
      image_name: analytics-etl
      job_name: analytics-etl
      staging_job_name: analytics-etl-nonprod
      prod_job_name: analytics-etl
      staging_project: f3data
      prod_project: f3data
      tag_prefix: analytics@
      dockerfile: apps/analytics/Dockerfile
      build_context: .
      staging_environment: analytics-nonprod
      prod_environment: analytics-production
      region: us-central1
      ar_repo: cloud-run-builds
      staging_runtime_service_account: analytics-etl-nonprod@f3data.iam.gserviceaccount.com
      prod_runtime_service_account: analytics-etl@f3data.iam.gserviceaccount.com
      staging_flags: >-
        --set-cloudsql-instances=f3data:us-central1:f3data-nonprod
        --tasks=1
        --parallelism=1
        --max-retries=0
        --task-timeout=60m
        --command=analytics-etl
        --args=run
        --set-env-vars=ANALYTICS_ENVIRONMENT=nonprod,ANALYTICS_POSTGRES_SOCKET_DIR=/cloudsql/f3data:us-central1:f3data-nonprod,ANALYTICS_POSTGRES_DATABASE=f3_staging,ANALYTICS_GCS_PREFIX=gs://f3-analytics-nonprod/parquets/pv_regions
        --set-secrets=ANALYTICS_POSTGRES_USER=analytics-etl-nonprod-database-user:latest,ANALYTICS_POSTGRES_PASSWORD=analytics-etl-nonprod-database-password:latest
      prod_flags: >-
        --set-cloudsql-instances=f3data:us-central1:f3data
        --tasks=1
        --parallelism=1
        --max-retries=0
        --task-timeout=60m
        --command=analytics-etl
        --args=run
        --set-env-vars=ANALYTICS_ENVIRONMENT=production,ANALYTICS_POSTGRES_SOCKET_DIR=/cloudsql/f3data:us-central1:f3data,ANALYTICS_POSTGRES_DATABASE=f3_prod,ANALYTICS_GCS_PREFIX=gs://analytics/parquets/pv_regions
        --set-secrets=ANALYTICS_POSTGRES_USER=analytics-etl-database-user:latest,ANALYTICS_POSTGRES_PASSWORD=analytics-etl-database-password:latest
