name: Deploy Analytics ETL

on:
  push:
    tags:
      - "analytics@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)deploy, e.g. analytics@1.2.3"
        required: true
        type: string

concurrency:
  group: deploy-analytics-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# id-token: write -> GCP OIDC (google-github-actions/auth); checks: read -> CI gate.
permissions:
  contents: read
  id-token: write
  checks: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-cloudrun-job.yml
    with:
      ref: ${{ inputs.tag }}
      image_name: analytics-etl
      job_name: analytics-etl
      staging_job_name: analytics-etl-nonprod
      prod_job_name: analytics-etl
      staging_project: f3data
      prod_project: f3data
      tag_prefix: analytics@
      dockerfile: apps/analytics/Dockerfile
      build_context: .
      staging_environment: analytics-nonprod
      prod_environment: analytics-production
      region: us-central1
      ar_repo: cloud-run-builds
      staging_runtime_service_account: analytics-etl-nonprod@f3data.iam.gserviceaccount.com
      prod_runtime_service_account: analytics-etl@f3data.iam.gserviceaccount.com
      # Production job deployment is enabled. Deploying the image/job does not execute the job
      # or publish data, but an enabled unattended invoker could execute the updated job; human
      # security, source-load, consumer, IAM, and release gates remain required and unverified.
      deploy_prod: true
      # The producer revision identifies this deployment attempt for tracking/retry, not github.sha:
      # workflow_dispatch may re-deploy a tag whose image commit differs. The reusable deploy
      # resolves that tag to the immutable image digest used by this run.
      staging_flags: >-
        --set-cloudsql-instances=f3data:us-central1:f3data-nonprod
        --tasks=1
        --parallelism=1
        --memory=16Gi
        --cpu=4
        --max-retries=0
        --task-timeout=60m
        --command=analytics-etl
        --args=run
        --set-env-vars=ANALYTICS_ENVIRONMENT=nonprod,ANALYTICS_POSTGRES_SOCKET_DIR=/cloudsql/f3data:us-central1:f3data-nonprod,ANALYTICS_POSTGRES_DATABASE=f3_staging,ANALYTICS_PRODUCER_REVISION=gha-${{ github.run_id }}-${{ github.run_attempt }}
        --set-secrets=ANALYTICS_POSTGRES_USER=analytics-etl-nonprod-database-user:latest,ANALYTICS_POSTGRES_PASSWORD=analytics-etl-nonprod-database-password:latest
      prod_flags: >-
        --set-cloudsql-instances=f3data:us-central1:f3data
        --tasks=1
        --parallelism=1
        --memory=16Gi
        --cpu=4
        --max-retries=0
        --task-timeout=60m
        --command=analytics-etl
        --args=run
        --set-env-vars=ANALYTICS_ENVIRONMENT=production,ANALYTICS_POSTGRES_SOCKET_DIR=/cloudsql/f3data:us-central1:f3data,ANALYTICS_POSTGRES_DATABASE=f3_prod,ANALYTICS_PRODUCER_REVISION=gha-${{ github.run_id }}-${{ github.run_attempt }}
        --set-secrets=ANALYTICS_POSTGRES_USER=analytics-etl-database-user:latest,ANALYTICS_POSTGRES_PASSWORD=analytics-etl-database-password:latest

  # Release cleanup ships with the publisher's image, so its pointer and
  # manifest validation always matches the code that wrote the releases.
  # Deploying updates the job without running it; production runs come from
  # Cloud Scheduler.
  deploy-release-gc-nonprod:
    needs: deploy
    concurrency:
      group: cloudrun-job-deploy-f3data-us-central1-analytics-release-gc-nonprod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # id-token: write -> GCP OIDC for the nonprod deploy identity.
    permissions:
      contents: read
      id-token: write
    environment:
      name: analytics-nonprod
    steps:
      - name: Authenticate to GCP (nonprod)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy release cleanup job (nonprod)
        env:
          IMAGE: ${{ needs.deploy.outputs.staging_image }}
          PRODUCER_REVISION: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ ! "${IMAGE}" =~ ^us-central1-docker\.pkg\.dev/f3data/cloud-run-builds/analytics-etl:[^@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected image reference: ${IMAGE}" >&2
            exit 1
          fi
          gcloud run jobs deploy analytics-release-gc-nonprod \
            --image "${IMAGE}" \
            --region us-central1 \
            --project f3data \
            --service-account analytics-release-gc-nonprod@f3data.iam.gserviceaccount.com \
            --tasks=1 \
            --parallelism=1 \
            --max-retries=0 \
            --task-timeout=30m \
            --memory=1Gi \
            --cpu=1 \
            --command=analytics-etl \
            --args=gc-releases,--apply \
            --set-env-vars="ANALYTICS_ENVIRONMENT=nonprod,ANALYTICS_CATALOG_BUCKET=f3-analytics-nonprod,ANALYTICS_PRODUCER_REVISION=${PRODUCER_REVISION}"

  deploy-release-gc-prod:
    needs: [deploy, deploy-release-gc-nonprod]
    concurrency:
      group: cloudrun-job-deploy-f3data-us-central1-analytics-release-gc
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # id-token: write -> GCP OIDC for the production deploy identity.
    permissions:
      contents: read
      id-token: write
    environment:
      name: analytics-production
    steps:
      - name: Authenticate to GCP (production)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Production and nonprod share project f3data, so the production job runs
      # the same staging-registry digest the publisher's production job does.
      - name: Deploy release cleanup job (production)
        env:
          IMAGE: ${{ needs.deploy.outputs.staging_image }}
          PRODUCER_REVISION: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ ! "${IMAGE}" =~ ^us-central1-docker\.pkg\.dev/f3data/cloud-run-builds/analytics-etl:[^@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected image reference: ${IMAGE}" >&2
            exit 1
          fi
          gcloud run jobs deploy analytics-release-gc \
            --image "${IMAGE}" \
            --region us-central1 \
            --project f3data \
            --service-account analytics-release-gc@f3data.iam.gserviceaccount.com \
            --tasks=1 \
            --parallelism=1 \
            --max-retries=0 \
            --task-timeout=30m \
            --memory=1Gi \
            --cpu=1 \
            --command=analytics-etl \
            --args=gc-releases,--apply \
            --set-env-vars="ANALYTICS_ENVIRONMENT=production,ANALYTICS_CATALOG_BUCKET=f3-analytics,ANALYTICS_PRODUCER_REVISION=${PRODUCER_REVISION}"
