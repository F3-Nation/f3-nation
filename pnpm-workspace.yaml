peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: "10"
    eslint-plugin-react-hooks>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
allowBuilds:
  "@sentry/cli": true
  core-js: true
  core-js-pure: true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
catalogMode: strict
cleanupUnusedCatalogs: true
# pnpm's publicHoistPattern defaults to [] (nothing is hoisted); the patterns below
# are opted in deliberately. sharp ships its native binary as platform-specific
# @img/* optional deps that live only in the virtual store, where Next.js'
# standalone output tracer can't resolve them at runtime; hoisting sharp + its
# binaries to the root node_modules lets them load natively. (eslint/prettier do
# not need hoisting: flat config resolves plugins through @acme/eslint-config and
# the binaries resolve from each package's own node_modules.)
publicHoistPattern:
  - "sharp"
  - "@img/*"
