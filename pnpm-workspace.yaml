overrides:
  "form-data@>=2.0.0 <2.5.6": "^4.0.6"
  "@auth/core": "0.41.3" # GHSA-7rqj-j65f-68wh / GHSA-xmf8-cvqr-rfgj (Auth.js email normalizer & getToken DoS)
  # Force patched versions of transitive deps flagged by `pnpm audit --prod
  # --audit-level=high`. Scoped to the vulnerable ranges so unaffected
  # consumers are untouched. Remove an entry once every dependent has upgraded.
  # 1.x cannot be forced to 5.x: minimatch@3 does `require('brace-expansion')()`
  # and v5 exports only a named `expand`. No 1.x/2.x/3.x/4.x backport exists for
  # GHSA-mh99-v99m-4gvg, so the two eslint-plugin paths on minimatch@3 are dev-only
  # and excluded from the prod audit via tooling/eslint devDependencies instead.
  "brace-expansion@<1.1.16": "2.1.4" # GHSA-3jxr-9vmj-r5cp (DoS)
  "brace-expansion@>=3.0.0 <5.0.9": "5.0.9" # GHSA-rgw5-rvv9-x895 (DoS)
  "fast-uri@<3.1.5": "3.1.6" # host confusion via failed backslash authority introducer
  "sharp@<0.35.0": "0.35.3" # inherited libvips vulnerabilities
  "next@>=16.0.0 <16.3.0": "16.3.2" # GHSA-89xv-2m56-2m9x / GHSA-p9j2-gv94-2wf4 (SSRF in rewrites); covers transitive geist>next & @scalar>next. Keep in lockstep with the `next` catalog entry: a second `next` version forks next-auth's peer instance and detaches the type-extensions augmentation.
  "postcss@<8.5.12": "^8.5.26" # GHSA-6g55-p6wh-862q (sourceMappingURL arbitrary file read)
  "nanoid@<3.3.17": "^3.3.18" # GHSA-2v37-7h3g-55p8
  "nanoid@>=4.0.0 <5.1.16": "^5.1.16" # GHSA-28wg-ghj8-5hjv
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: "10"
    eslint-plugin-react-hooks>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
# @hookform/resolvers declares only react-hook-form as a peer, not its validator,
# so pnpm's isolated linker never symlinks zod into the resolver's virtual-store
# dir. Its `@hookform/resolvers/zod` entry then does `import "zod/v4/core"`, which
# the bundler resolves from the resolver's .pnpm location and can't find -> Next
# fails with "Can't resolve 'zod/v4/core'". Declaring zod as a peer here makes pnpm
# link the consumer's zod (packages/ui, via catalog) into the resolver. Optional so
# any future non-zod consumer doesn't warn.
packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "*"
    peerDependenciesMeta:
      zod:
        optional: true
allowBuilds:
  "@sentry/cli": true
  core-js: true
  core-js-pure: true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
catalogMode: strict
cleanupUnusedCatalogs: true
# pnpm's publicHoistPattern defaults to [] (nothing is hoisted); the patterns below
# are opted in deliberately. sharp ships its native binary as platform-specific
# @img/* optional deps that live only in the virtual store, where Next.js'
# standalone output tracer can't resolve them at runtime; hoisting sharp + its
# binaries to the root node_modules lets them load natively. (eslint/prettier do
# not need hoisting: flat config resolves plugins through @acme/eslint-config and
# the binaries resolve from each package's own node_modules.)
publicHoistPattern:
  - "sharp"
  - "@img/*"
minimumReleaseAge: 0
