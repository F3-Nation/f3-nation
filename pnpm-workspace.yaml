overrides:
  "form-data@>=2.0.0 <2.5.6": "^4.0.6"
  "@auth/core": "0.41.2"
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: "10"
    eslint-plugin-react-hooks>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
# @hookform/resolvers declares only react-hook-form as a peer, not its validator,
# so pnpm's isolated linker never symlinks zod into the resolver's virtual-store
# dir. Its `@hookform/resolvers/zod` entry then does `import "zod/v4/core"`, which
# the bundler resolves from the resolver's .pnpm location and can't find -> Next
# fails with "Can't resolve 'zod/v4/core'". Declaring zod as a peer here makes pnpm
# link the consumer's zod (packages/ui, via catalog) into the resolver. Optional so
# any future non-zod consumer doesn't warn.
packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "*"
    peerDependenciesMeta:
      zod:
        optional: true
allowBuilds:
  "@sentry/cli": true
  core-js: true
  core-js-pure: true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
catalogMode: strict
cleanupUnusedCatalogs: true
# pnpm's publicHoistPattern defaults to [] (nothing is hoisted); the patterns below
# are opted in deliberately. sharp ships its native binary as platform-specific
# @img/* optional deps that live only in the virtual store, where Next.js'
# standalone output tracer can't resolve them at runtime; hoisting sharp + its
# binaries to the root node_modules lets them load natively. (eslint/prettier do
# not need hoisting: flat config resolves plugins through @acme/eslint-config and
# the binaries resolve from each package's own node_modules.)
publicHoistPattern:
  - "sharp"
  - "@img/*"
minimumReleaseAge: 0
