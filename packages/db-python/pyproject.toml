[project]
name = "f3-data-models"
version = "1.1.0"
description = "The data schema and models for F3 Nation applications."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-or-later"
authors = [{name = "Evan Petzoldt", email = "evan.petzoldt@protonmail.com"}]
dependencies = [
    "sqlalchemy==2.0.52",
    "psycopg2-binary==2.9.13",
    "sqlmodel==0.0.48",
    "sqlalchemy-citext==1.8.0",
    "pg8000==1.31.5",
    "cloud-sql-python-connector==1.21.0",
    "sqlalchemy-bigquery==1.17.2",
]

[project.urls]
Repository = "https://github.com/F3-Nation/f3-data-models"
Documentation = "https://github.io/F3-Nation/f3-data-models"

[dependency-groups]
dev = [
    "poethepoet==0.49.0",
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.poe.tasks]
install-js = "npm install"
build-js = "npm run build"
install-mermaid-js = "npm install --save-dev @mermaid-js/mermaid-cli"

[build-system]
requires = ["setuptools==84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["f3_data_models"]
