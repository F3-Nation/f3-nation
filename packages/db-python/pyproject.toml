[project]
name = "f3-data-models"
version = "1.1.0"
description = "The data schema and models for F3 Nation applications."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "AGPL-3.0-or-later"
authors = [{name = "Evan Petzoldt", email = "evan.petzoldt@protonmail.com"}]
dependencies = [
    "sqlalchemy>=2.0.36,<3.0.0",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "sqlmodel>=0.0.22,<0.0.23",
    "sqlalchemy-citext>=1.8.0,<2.0.0",
    "pg8000>=1.31.5,<2.0.0",
    "cloud-sql-python-connector>=1.20.0,<2.0.0",
    "sqlalchemy-bigquery>=1.13.0,<2.0.0",
]

[project.urls]
Repository = "https://github.com/F3-Nation/f3-data-models"
Documentation = "https://github.io/F3-Nation/f3-data-models"

[dependency-groups]
dev = [
    "poethepoet>=0.34.0,<0.35.0",
]

[tool.ruff]
line-length = 120

lint.select = [
    "E",  # pycodestyle errors (settings from FastAPI, thanks, @tiangolo!)
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
lint.ignore = [
    "C901",  # too complex 
]

[tool.ruff.lint.isort]
order-by-type = true
relative-imports-order = "closest-to-furthest"
extra-standard-library = ["typing"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = []


[tool.poe.tasks]
install-js = "npm install"
build-js = "npm run build"
install-mermaid-js = "npm install --save-dev @mermaid-js/mermaid-cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["f3_data_models"]
